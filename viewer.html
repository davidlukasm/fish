<script>
// Ansichtsmenü: Symbole des vom Standard Abweichenden neben dem Namen, gemerkte Ebenen, Schließen.
(function () {
  var layers = ['layer-plankton', 'layer-sperm', 'layer-turbidity', 'layer-light'];
  function marks() {
    var active = document.getElementById('view-active'), list = [];
    if (!active) return;
    var mode = document.getElementById('observation-mode');
    if (mode && mode.value !== 'normal') list.push(mode.selectedOptions[0].textContent.charAt(0));
    document.querySelectorAll('.view-toggle input').forEach(function (box) {
      var standard = /^layer-|keep-hover-info|show-cockpit/.test(box.id);
      if (box.checked !== standard)
        list.push((box.checked ? '' : '¬') + box.parentElement.querySelector('i').textContent);
    });
    active.textContent = list.join(' ');
  }
  document.addEventListener('DOMContentLoaded', function () {
    layers.forEach(function (id) {
      try {
        var v = localStorage.getItem('fish-' + id);
        if (v !== null) document.getElementById(id).checked = v === '1';
      } catch (e) {}
    });
    marks();
  });
  document.addEventListener('change', function (e) {
    if (layers.indexOf(e.target.id) >= 0)
      try { localStorage.setItem('fish-' + e.target.id, e.target.checked ? '1' : '0'); } catch (x) {}
    marks();
  });
  document.addEventListener('pointerdown', function (e) {
    var menu = document.querySelector('.view-menu');
    if (menu && menu.open && !menu.contains(e.target)) menu.open = false;
  });
  document.addEventListener('click', function (e) {
    var action = e.target.closest && e.target.closest('.view-action');
    if (action) action.closest('details').open = false;
  });
  setInterval(marks, 1000);
})();
</script>

<script>
(() => {
  document.getElementById('error-reload').onclick = () => location.reload();
  document.getElementById('error-diagnose').onclick = () => document.getElementById('tank-diagnose').click();
  const report = error => {
    const status = document.getElementById('tank-status');
    if (!status.textContent.startsWith('Lauf wird geladen')) return;
    status.textContent = 'Start fehlgeschlagen';
    document.getElementById('error-panel').hidden = false;
    document.getElementById('error-status').textContent = 'Oberfläche konnte nicht starten';
    document.getElementById('error').textContent =
      error?.message || String(error || 'Die Oberfläche konnte nicht geladen werden.');
  };
  window.addEventListener('error', event => {
    if (event.target?.tagName === 'SCRIPT')
      report('JavaScript-Datei konnte nicht geladen werden: ' + event.target.src);
    else if (event.error || event.message)
      report(event.error || event.message);
  }, true);
  window.addEventListener('unhandledrejection', event => report(event.reason));
  import('/ui/app.js').catch(report);
})();
</script>
