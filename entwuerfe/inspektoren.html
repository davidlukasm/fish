<meta charset="utf-8">

<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: three inspector panels at their real 320 px width, side by side, as in the atelier. */
:root{color-scheme:dark;--ground:#09212a;--panel:#143039;--edge:#2d5059;--text:#d7e6e3;--soft:#9fbcbc;--axis:#a7c2be;

  --eggs:#d4b7ee;--fish:#8ac7bb;--track:#0f2c34}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:14px/1.45 system-ui,sans-serif}
main{display:flex;flex-wrap:wrap;gap:24px;padding-block:20px;align-items:flex-start}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{width:320px;max-width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px 10px 14px}
.panel h2{margin:0 0 2px 2px;font:500 12px/1.3 system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.panel h3{margin:0 0 6px 2px;font:400 21px/1.2 Georgia,serif;color:#eef4ec}
svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;overflow:visible}
svg text{fill:var(--axis);font-size:11px}
svg text.head{fill:var(--text);font-size:12px;font-weight:500}
svg text.value{fill:var(--text);font-variant-numeric:tabular-nums}
.grip{fill:var(--handle-core);stroke:var(--handle);stroke-width:2.2;cursor:grab}
.grip:hover,.grip.dragging{stroke:#fff3c4;stroke-width:3}

.chip{cursor:pointer}
.triggers{display:flex;flex-direction:column;gap:5px;margin:2px 0 6px}
.trow{display:flex;align-items:center;gap:6px;position:relative}
.trow.gap{margin-top:7px}
.check{flex:0 0 92px;display:flex;align-items:center;gap:6px;font:12px system-ui;color:var(--text);background:none;border:0;padding:0;cursor:pointer;text-align:left}

.check[aria-checked=true] .box{border-color:var(--handle);background:#2c5a5e}

.check[aria-checked=false]{color:var(--soft)}
.check:focus-visible{outline:2px solid var(--handle);outline-offset:2px}
.seg{display:flex;flex:1;min-width:0;border:1px solid var(--edge);border-radius:14px;background:var(--track);overflow:hidden}
.seg.off{opacity:.38;pointer-events:none}
.seg>button{font:12px system-ui;color:var(--axis);background:none;border:0;border-left:1px solid var(--edge);padding:0 8px;height:26px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;min-width:0}
.seg>button:first-child{border-left:0;border-radius:13px 0 0 13px}.seg>button:last-child{border-radius:0 13px 13px 0}
.seg>button.mat{flex:0 0 52px;justify-content:center}.seg>button.stuff{flex:1;justify-content:flex-start}
.seg>button .name{overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.seg>button .caret{width:0;height:0;border:4px solid transparent;border-top:5px solid currentColor;margin-top:4px}
.seg>button:hover{color:var(--text)}
.seg>button.on{background:#2c5a5e;color:#f4efd8;box-shadow:inset 0 0 0 1.5px var(--handle)}
.seg>button:focus-visible{outline:2px solid var(--handle);outline-offset:-2px}
.sdot{width:15px;height:15px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font:700 8px/1 system-ui;color:#0d262c;letter-spacing:-.02em}
.sdot.free{border:1.5px dashed var(--soft);color:var(--soft)}
.menu{position:absolute;z-index:5;right:0;top:29px;width:206px;background:#18363f;border:1.5px solid var(--handle);border-radius:10px;padding:4px;box-shadow:0 8px 20px #0008;display:flex;flex-direction:column}
.menu button{font:12px system-ui;color:var(--text);background:none;border:0;border-radius:6px;padding:5px 6px;display:flex;align-items:center;gap:7px;cursor:pointer;text-align:left}
.menu button:hover,.menu button.pick{background:#2c5a5e}

.menu .soft{color:var(--soft)}
.menu svg{margin:2px auto 4px;width:150px}
.panel h4{margin:16px 0 4px 0;padding-top:8px;border-top:1px solid var(--edge);font:600 13px/1.3 system-ui;color:#eef4ec;display:flex;align-items:center;gap:7px}
.panel h5.mixhead{margin:22px 0 2px;font:500 12px/1.3 system-ui;color:var(--axis);text-align:center}
.panel h4.first{border-top:0;padding-top:0;margin-top:6px}
.panel h4 .sdot{width:16px;height:16px}
.chip rect{fill:var(--track);stroke:var(--edge)}

.note{color:var(--soft);font-size:12px;max-width:1010px;padding-block:0 24px;margin:0}
.note b{color:var(--text);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes squeeze{0%,100%{r:4.6;stroke-width:1.4}40%{r:2.6;stroke-width:3.2}}
</style>
<main>
  <section class="panel" aria-label="Darm">
    <h2>Organ</h2><h3>Darm</h3>

  </section>
</main>
<script>

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const path = pts => 'M' + pts.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(' L');
let held = null;
function drag(svg, grip, move, name) {

  el('circle', {cx : x, cy : y, r, style : `fill:#0f2c34;stroke:${red ? '#e8a2b5' : '#5d8384'};stroke-width:1.4`}, g);
  el('path', {d : red ? `M${x - d * .8} ${y - d * .8} l${1.6 * d} ${1.6 * d} m0 ${-1.6 * d} l${-1.6 * d} ${1.6 * d}` : `M${x - d} ${y} h${2 * d}` + (sign === '+' ? ` M${x} ${y - d} v${2 * d}` : ''), stroke : red ? '#e8a2b5' : '#d7e6e3', 'stroke-width' : 1.5, 'stroke-linecap' : 'round'}, g);

  if (kind === 'hatch') {

  } else { const w = 14 * s, h = 6 * s; el('path', {d : `M${x - w} ${cy} Q${x} ${cy - h * 1.6} ${x + w} ${cy} Q${x} ${cy + h * 1.6} ${x - w} ${cy} Z M${x + w} ${cy} l${5 * s} ${-4 * s} v${8 * s} Z`, ...line}, svg); }
}
const fibreColour = f => { const lo = [184, 68, 63], hi = [242, 235, 226]; return 'rgb(' + lo.map((v, i) => Math.round(v + (hi[i] - v) * f)).join(',') + ')'; };
const keyColour = i => ['#79d2be', '#5fb3a8', '#a6e3d3'][i % 3];
const STOMACH_FILL = '#c98f55', STOMACH_EDGE = '#e6b47c', TUBE = '#6b6f5f', MUSCLE = '#9a6a48';

// ===== The model: the one source for every picture and number =====
// Engine (Fable FAKTEN 9): the gut's length is set once at birth; at rest a meal stays 200 steps
// per unit of length (0.5 to 4). Its muscle, an organ of its own, drives the contents up to four
// times as fast: its nodes add up, each with its fibres; over the life it works from the maturity
// its nodes start at to the one they die at, and drives the more strongly the bigger the body.
// Within each twitch the stay swings between rest and twice the mean pace.
const S = {
  length : 1.4,
  nodes : [{strength : .5, fast : .3}, {strength : .35, fast : .75}], chosen : 0,
  from : .1, until : 1,
  stomach : .45,
  full : {keys : [{gate : .6, spread : .1}], chosen : 0, input : {rise : 40, height : .8, stop : 180}, getsUsed : false},
  ache : {keys : [{gate : .3, spread : .1, used : 60}], chosen : 0, input : {rise : 15, height : .7, stop : 160}, getsUsed : true},
  feed : {keys : [{gate : .25, spread : .1, used : 60}], chosen : 0, input : {rise : 10, height : .6, stop : 60}, getsUsed : true}
};
const FASTEST = 4, SHORT = 50, LONG = 800;
const rest = () => 200 * S.length;
const drive = () => 1 + (FASTEST - 1) * (1 - Math.exp(-S.nodes.reduce((t, n) => t + n.strength * (.6 + .8 * n.fast), 0) * 1.6));
const bodyDrive = s => { const push = r => r / (r + .5); return Math.pow(push(2 / 3 + s / 3) / push(1), 2); };
const pace = s => s >= S.from && s <= S.until ? 1 + (drive() - 1) * bodyDrive(s) : 1;
const meanStay = s => rest() / pace(s);
const swingStay = s => rest() / (1 + 2 * (pace(s) - 1));
const LIFE = Array.from({length : 61}, (_, k) => k / 60);
// Every stay this fish's gut ever has: from the shortest swing over its life to rest.
const windowOf = () => [Math.min(...LIFE.map(swingStay)), rest()];

// Foods by their stuffs (David's values: leaf best 92 %, meat 82 %, algae 78 % held to the long
// end, plankton 72 %; at stay 50 algae 18 % and plankton 34 %).
const STUFFS = {flesh : [0, 20, 225, 1], shell : [100, 4, 480, .86], pulp : [0, 33, 800, 1], soft : [245, 80, 0, .955], hard : [430, 2, 0, 1]};

function stuffYield(t, [opens, uptake, spoils, eff]) {
  const k = 1 / uptake, r = opens > 0 ? Math.min(1, Math.pow(t / opens, 4) / t) : Infinity, open = opens > 0 ? r / (r + 1 / t) : 1;

// Bellyache of a full gut of a food at a stay: meat spoils when it stays long, fibre that passes
// unopened hurts when it stays short. Flocks never hurt.
function ache(f, t) {
  const flesh = f.flesh ?? 0, fibre = (f.hard ?? 0) + (f.soft ?? 0);
  const rot = flesh > 0 ? clamp((t - (140 + 380 * (1 - flesh))) / 180, 0, 1) * Math.sqrt(flesh) : 0;
  const onset = fibre > .4 ? 360 * (fibre - .4) / .6 : 0;

const AXIS = Array.from({length : 141}, (_, k) => SHORT * Math.pow(LONG / SHORT, k / 140));

// What a food gives this fish over its life (every stay in the window), and where a full gut of

  return {min : Math.min(...g), max : Math.max(...g), sore : sore.length ? [Math.min(...sore), Math.max(...sore)] : null};

// The kind: the food that pays best somewhere in this fish's life.
const kindOf = () => {
  const top = FOOD.map(([n, f]) => [n, foodRange(f).max]).sort((a, b) => b[1] - a[1])[0][0];
  return {Blatt : 'Pflanzenfresser', Alge : 'Algenfresser', Flocken : 'Allesfresser', Plankton : 'Planktonfresser', Fleisch : 'Räuber'}[top];
};

// ===== The fish: stomach, gut and its muscle =====
// The whole width. The stomach holds the satiety thresholds (keys at the left, (+)/(−) below it);
// the gut loops from the stomach to the vent, as long as it is (its end is dragged); its wall is
// the muscle, brown, squeezing in waves as strong as the muscle. Under the fish the muscle's nodes
// as in the tail: colour = fibres, height = strength; their fibres on the bar below.
const BODY = 'M14 64 Q30 26 110 22 Q200 22 236 52 L284 28 Q276 64 284 100 L236 76 Q200 112 110 108 Q30 104 14 64 Z';
const STOMACH = {x : 92, y : 64, rx : 26, ry : 24}, VENT = [232, 92];
const SHORTEST = .5, LONGEST = 4, GUT_LEFT = 126, GUT_RIGHT = [150, 226];
const gutEnd = () => GUT_RIGHT[0] + (GUT_RIGHT[1] - GUT_RIGHT[0]) * (S.length - SHORTEST) / (LONGEST - SHORTEST);
function stomachPath(c) {
  const {x, y, rx : w, ry : h} = c;

  el('path', {d : BODY, transform : 'translate(0 10)', fill : '#16363e', stroke : '#3b6a6c'}, svg);

  el('path', {d : `M${STOMACH.x - 22} ${STOMACH.y - 30} Q${STOMACH.x - 18} ${STOMACH.y - 18} ${STOMACH.x - 12} ${STOMACH.y - 22}`, stroke : TUBE, 'stroke-width' : 5, fill : 'none', 'stroke-linecap' : 'round'}, g);

            el('path', {d : `M${x0.toFixed(1)} ${y0.toFixed(1)} L${x1.toFixed(1)} ${y1.toFixed(1)}`, stroke : TUBE, 'stroke-width' : 6, 'stroke-linecap' : 'round'}, film.tube)];
  });

    drag(svg, el('rect', {x : KX - 7, y : y - 4 + 10, width : 14, height : 8, rx : 2, style : `fill:${keyColour(i)};stroke:${i === full.chosen ? '#ffffff' : '#0d262c'};stroke-width:${i === full.chosen ? 2 : 1}`}, svg),
      p => { k.gate = clamp((st.y + st.ry - (p.y - 10)) / (2 * st.ry), .05, .95); full.chosen = i; draw(); }, 'fishkey' + i);
  });

  chip(svg, st.x - 10, st.y + st.ry + 22, '−', () => { full.keys.splice(full.chosen, 1); full.chosen = 0; }, full.keys.length > 1);
  chip(svg, st.x + 10, st.y + st.ry + 22, '+', () => { full.keys.push({gate : clamp(Math.min(...full.keys.map(k => k.gate)) - .2, .1, .9), spread : .1}); full.chosen = full.keys.length - 1; }, full.keys.length < 3);

    const k = keys[cell.chosen], st = Math.min(N, inp.rise + k.used * Math.LN2), x = X(st);
    el('path', {d : `M${x} ${A0} V${A1}`, stroke : keyColour(cell.chosen), 'stroke-dasharray' : '2 3'}, svg);
    txt(svg, x + (x > (L + R) / 2 ? -6 : 6), A0 + 10, 'halb gewöhnt', {'text-anchor' : x > (L + R) / 2 ? 'end' : 'start', style : 'font-size:10px'});
    drag(svg, el('rect', {x : x - 5, y : A1 - 7, width : 10, height : 14, rx : 3, style : 'stroke:' + keyColour(cell.chosen)}, svg), p => { k.used = clamp((stOf(p.x) - inp.rise) / Math.LN2, 4, 1024); draw(); }, id + 'used');
  }
  for (const st of [0, 100, 200]) txt(svg, X(st), A1 + 14, st, {'text-anchor' : st ? 'middle' : 'start'});
  txt(svg, R, A1 + 14, N + ' Schritte', {'text-anchor' : 'end'});
  svg.setAttribute('viewBox', `0 0 300 ${A1 + 20}`);
}

// ===== Everything from the model =====
function draw() {
  document.getElementById('gut-kind').textContent = kindOf();
  drawFish(); drawYield(); drawLife(); drawBars();
  for (const id of ['full', 'ache', 'feed']) drawSense(id);
}
draw();
requestAnimationFrame(fishFrame);
</script>
