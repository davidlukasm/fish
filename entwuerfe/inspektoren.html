<title>Muster-Inspektoren Atelier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: three inspector panels at their real 320 px width, side by side, as in the atelier. */
:root{color-scheme:dark;--ground:#09212a;--panel:#143039;--edge:#2d5059;--text:#d7e6e3;--soft:#9fbcbc;--axis:#a7c2be;
  --handle:#f1dda6;--handle-core:#153a40;--teal:#79d2be;--motor:#eaa886;--gut:#d9cfae;--cost:#e8a2b5;
  --eggs:#d4b7ee;--fish:#8ac7bb;--track:#0f2c34}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:14px/1.45 system-ui,sans-serif}
main{display:flex;flex-wrap:wrap;gap:24px;padding-block:20px;align-items:flex-start}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{width:320px;max-width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px 10px 14px}
.panel h2{margin:0 0 2px 2px;font:500 12px/1.3 system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.panel h3{margin:0 0 6px 2px;font:400 21px/1.2 Georgia,serif;color:#eef4ec}
svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;overflow:visible}
svg text{fill:var(--axis);font-size:11px}
svg text.head{fill:var(--text);font-size:12px;font-weight:500}
svg text.value{fill:var(--text);font-variant-numeric:tabular-nums}
.grip{fill:var(--handle-core);stroke:var(--handle);stroke-width:2.2;cursor:grab}
.grip:hover,.grip.dragging{stroke:#fff3c4;stroke-width:3}
.grip.dragging{cursor:grabbing}
.chip{cursor:pointer}
.triggers{display:flex;flex-direction:column;gap:5px;margin:2px 0 6px}
.trow{display:flex;align-items:center;gap:6px;position:relative}
.trow.gap{margin-top:7px}
.check{flex:0 0 92px;display:flex;align-items:center;gap:6px;font:12px system-ui;color:var(--text);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.check .box{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--edge);background:var(--track);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.check[aria-checked=true] .box{border-color:var(--handle);background:#2c5a5e}
.check[aria-checked=true] .box::after{content:"";width:8px;height:4px;border:solid #f4efd8;border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg)}
.check[aria-checked=false]{color:var(--soft)}
.check:focus-visible{outline:2px solid var(--handle);outline-offset:2px}
.seg{display:flex;flex:1;min-width:0;border:1px solid var(--edge);border-radius:14px;background:var(--track);overflow:hidden}
.seg.off{opacity:.38;pointer-events:none}
.seg>button{font:12px system-ui;color:var(--axis);background:none;border:0;border-left:1px solid var(--edge);padding:0 8px;height:26px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;min-width:0}
.seg>button:first-child{border-left:0;border-radius:13px 0 0 13px}.seg>button:last-child{border-radius:0 13px 13px 0}
.seg>button.mat{flex:0 0 52px;justify-content:center}.seg>button.stuff{flex:1;justify-content:flex-start}
.seg>button .name{overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.seg>button .caret{width:0;height:0;border:4px solid transparent;border-top:5px solid currentColor;margin-top:4px}
.seg>button:hover{color:var(--text)}
.seg>button.on{background:#2c5a5e;color:#f4efd8;box-shadow:inset 0 0 0 1.5px var(--handle)}
.seg>button:focus-visible{outline:2px solid var(--handle);outline-offset:-2px}
.sdot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.sdot.free{border:1.5px dashed var(--soft)}
.menu{position:absolute;z-index:5;right:0;top:29px;width:206px;background:#18363f;border:1.5px solid var(--handle);border-radius:10px;padding:4px;box-shadow:0 8px 20px #0008;display:flex;flex-direction:column}
.menu button{font:12px system-ui;color:var(--text);background:none;border:0;border-radius:6px;padding:5px 6px;display:flex;align-items:center;gap:7px;cursor:pointer;text-align:left}
.menu button:hover,.menu button.pick{background:#2c5a5e}
.menu hr{border:0;border-top:1px solid var(--edge);margin:3px 2px}
.menu .soft{color:var(--soft)}
.menu svg{margin:2px auto 4px;width:150px}
.panel h4{margin:16px 0 4px 0;padding-top:8px;border-top:1px solid var(--edge);font:600 13px/1.3 system-ui;color:#eef4ec;display:flex;align-items:center;gap:7px}
.panel h4.first{border-top:0;padding-top:0;margin-top:6px}
.panel h4 .sdot{width:12px;height:12px}
.chip rect{fill:var(--track);stroke:var(--edge)}
.chip:hover rect{stroke:var(--handle)}
.note{color:var(--soft);font-size:12px;max-width:1010px;padding-block:0 24px;margin:0}
.note b{color:var(--text);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes squeeze{0%,100%{r:4.6;stroke-width:1.4}40%{r:2.6;stroke-width:3.2}}
</style>
<main>
  <section class="panel" aria-label="Lebenszyklus der Zelle">
    <h2>Zelle</h2><h3>Lebenszyklus der Zelle</h3>
    <h4>Auslöser</h4>
    <div class="triggers" id="triggers"></div>
    <h4>Lebensphasen</h4>
    <svg id="life" viewBox="0 0 300 220"></svg>
    <div id="stuffs"></div>
  </section>
  <section class="panel" aria-label="Darm">
    <h2>Organ</h2><h3>Darm</h3>
    <h4 id="gut-kind">Allesfresser</h4>
    <svg id="gut" viewBox="0 0 300 116"></svg>
    <h4>Verdauung</h4>
    <svg id="gutchart" viewBox="0 0 300 160"></svg>
    <h4>Ertrag je Futter</h4>
    <svg id="gutbars" viewBox="0 0 300 130"></svg>
    <h4>Schmerzzellen</h4>
    <svg id="gutpain" viewBox="0 0 300 90"></svg>
    <h4>Futterzellen</h4>
    <svg id="gutsense" viewBox="0 0 300 130"></svg>
  </section>
  <section class="panel" aria-label="Schwanz">
    <h2>Organ</h2><h3>Schwanz</h3>
    <h4>Muskelknoten</h4>
    <svg id="tail" viewBox="0 0 300 150"></svg>
    <h4>Rekrutierung</h4>
    <svg id="tailcmd" viewBox="0 0 300 150"></svg>
    <h4>Ausdauer</h4>
    <svg id="tailtime" viewBox="0 0 300 150"></svg>
    <h4>Nische</h4>
    <svg id="tailniche" viewBox="0 0 300 130"></svg>
  </section>
</main>
<p class="note"><b>Entwurf zum Anklicken.</b> Gezogen wird an den gelben Griffen.</p>
<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const txt = (parent, x, y, s, attrs = {}) => { const t = el('text', {x, y, ...attrs}, parent); t.textContent = s; return t; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pct = x => Math.round(x * 100) + ' %';
// Dragging: the pointer is captured by the drawing itself, which stays while its contents are
// redrawn on every move; the held grip is marked again after each redraw by its name.
let held = null;
function drag(svg, grip, move, name = 'grip' + svg.querySelectorAll('.grip').length) {
  grip.classList.add('grip');
  grip.setAttribute('data-name', name);
  if (held?.svg === svg && held.name === name) grip.classList.add('dragging');
  grip.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    svg.setPointerCapture(e.pointerId);
    held = {svg, name};
    grip.classList.add('dragging');
    const at = ev => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
    const onMove = ev => move(at(ev));
    const up = () => { held = null; svg.removeEventListener('pointermove', onMove); svg.removeEventListener('pointerup', up); svg.removeEventListener('pointercancel', up); svg.querySelectorAll('.dragging').forEach(g => g.classList.remove('dragging')); };
    svg.addEventListener('pointermove', onMove); svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  });
}
// A bar of a share, with its value at the right.
function bar(svg, x, y, w, share, colour, value, name) {
  if (name) txt(svg, 4, y + 10, name);
  el('rect', {x, y, width : w, height : 12, rx : 3, fill : '#0f2c34', stroke : '#2d5059'}, svg);
  el('rect', {x, y, width : w * clamp(share, 0, 1), height : 12, rx : 3, fill : colour, opacity : .75}, svg);
  txt(svg, 296, y + 10, value, {'text-anchor' : 'end', class : 'value'});
}

// ---------- Lebenszyklus ----------
// Three actions: the cell comes into being, it dies, and between the two it works. Each is one
// answer that switches once, from a level before to a level after, at a point and with a steepness
// (hormones.hh: x = (c / half)^(2^steepness), answer = before + (after − before)·x / (1 + x)),
// steepness a number from 0 to 3. c is what the cell's place on the substance wheel hears: the
// fish's maturity, one messenger, or a mix of all within its width (hormone_affinity). An action
// that is not ticked runs by itself: the cell is there from the egg on, works fully, and dies with
// the fish. The life itself, egg to adult, is the picture the curve lies on.
const PALETTE = ['#9cc8f0', '#e8a2b5', '#d4b7ee', '#8fdcc0', '#f0c58a', '#c9e58f'];
// The fish's messengers: named ones in use, the rest free (dashed) until made.
const STUFF = [{name : 'Wachstum'}, {name : 'Stress'}, {name : 'Laichzeit'}, {name : null}, {name : null}, {name : null}];
// The wheel: six messengers along an arc, maturity after them (hormones.hh, SUBSTANCE_TURNS).
const WHEEL = [...PALETTE.map((c, k) => k * 40), 280];
const ACTIONS = [['become', 'Entstehen'], ['die', 'Tod'], ['work', 'Aktivität']];
// Where the young fish counts as grown (maturity), for the picture only.
const ADULT = .72;
const life = {
  hatch : .3,
  become : {on : true, by : 'maturity', stuff : 0, at : .12},
  die : {on : false, by : 'stuff', stuff : 1, at : .7},
  work : {on : true, by : 'maturity', stuff : 0, at : .7, from : 1, to : .3, steep : 2},
  mix : {x : .55, y : .35, width : .35}
};
let menuOpen = null;
const source = a => !a.on ? 'auto' : a.by === 'stuff' ? 'stuff' + a.stuff : a.by;
const stuffName = i => STUFF[i].name ?? 'Botenstoff ' + (i + 1);
const mixWeights = () => {
  const m = life.mix, sigma = .15 + 1.85 * m.width;
  return WHEEL.map(deg => { const r = deg * Math.PI / 180, dx = m.x - Math.cos(r), dy = m.y - Math.sin(r); return Math.exp(-(dx * dx + dy * dy) / (2 * sigma * sigma)); });
};
const mixPaint = () => {
  const w = mixWeights().slice(0, 6), used = w.map((v, i) => [v, i]).filter(([v, i]) => v > .1 && STUFF[i].name);
  if (!used.length) return '#5d8384';
  return 'conic-gradient(' + used.map(([, i], k) => `${PALETTE[i]} ${k / used.length * 100}% ${(k + 1) / used.length * 100}%`).join(',') + ')';
};
const sourceName = (by, long) => by === 'mix' ? (long ? 'Mischung von Botenstoffen' : 'Mischung') : stuffName(Number(by.slice(5)));
const sourceColour = by => by === 'mix' ? '#c7d6c0' : PALETTE[Number(by.slice(5))];
const bound = (c, half, steep) => { const x = Math.pow(Math.max(0, c) / half, Math.pow(2, steep)); return x / (1 + x); };
const levelAt = (w, c) => w.from + (w.to - w.from) * bound(c, Math.max(.02, w.at), w.steep);
const html = (tag, attrs = {}, parent, text) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; };
function stuffDot(parent, by) {
  const d = html('span', {class : 'sdot'}, parent);
  if (by === 'mix') d.style.background = mixPaint();
  else { const i = Number(by.slice(5)); if (STUFF[i].name) d.style.background = PALETTE[i]; else d.classList.add('free'); }
  return d;
}
// The choices: a tick for each action, then maturity or a messenger, picked inside the button.
function drawTriggers() {
  const box = document.getElementById('triggers'); box.replaceChildren();
  for (const [key, name] of ACTIONS) {
    const a = life[key], row = html('div', {class : 'trow' + (key === 'work' ? ' gap' : '')}, box);
    const tick = html('button', {class : 'check', role : 'checkbox', 'aria-checked' : a.on, 'data-trigger' : key, 'data-by' : 'tick'}, row);
    html('span', {class : 'box'}, tick); html('span', {}, tick, name);
    tick.addEventListener('click', () => { a.on = !a.on; menuOpen = null; drawLife(); });
    const seg = html('div', {class : 'seg' + (a.on ? '' : ' off'), role : 'group', 'aria-label' : name}, row);
    const mat = html('button', {class : 'mat' + (a.on && a.by === 'maturity' ? ' on' : ''), 'data-trigger' : key, 'data-by' : 'maturity'}, seg, 'Reife');
    mat.addEventListener('click', () => { a.by = 'maturity'; menuOpen = null; drawLife(); });
    const by = a.by === 'mix' ? 'mix' : 'stuff' + a.stuff, chosen = a.on && a.by !== 'maturity';
    const st = html('button', {class : 'stuff' + (chosen ? ' on' : ''), 'data-trigger' : key, 'data-by' : 'stuff', 'aria-haspopup' : 'menu', 'aria-expanded' : menuOpen === key}, seg);
    stuffDot(st, by); html('span', {class : 'name'}, st, chosen ? sourceName(by) : 'Botenstoff'); html('span', {class : 'caret'}, st);
    st.addEventListener('click', e => { e.stopPropagation(); if (a.by === 'maturity') a.by = STUFF[a.stuff].name ? 'stuff' : 'stuff'; menuOpen = menuOpen === key ? null : key; drawLife(); });
    if (menuOpen === key) drawMenu(row, a, key);
  }
}
function drawMenu(row, a, key) {
  const menu = html('div', {class : 'menu', role : 'menu'}, row);
  menu.addEventListener('click', e => e.stopPropagation());
  STUFF.forEach((s, i) => {
    if (!s.name) return;
    const b = html('button', {role : 'menuitemradio', class : a.by === 'stuff' && a.stuff === i ? 'pick' : '', 'data-stuff' : i}, menu);
    stuffDot(b, 'stuff' + i); html('span', {}, b, s.name);
    b.addEventListener('click', () => { a.by = 'stuff'; a.stuff = i; menuOpen = null; drawLife(); });
  });
  const free = STUFF.findIndex(s => !s.name);
  if (free >= 0) {
    const b = html('button', {role : 'menuitem', 'data-stuff' : 'new'}, menu);
    stuffDot(b, 'stuff' + free); html('span', {class : 'soft'}, b, 'Neuer Botenstoff');
    b.addEventListener('click', () => { STUFF[free].name = 'Botenstoff ' + (free + 1); a.by = 'stuff'; a.stuff = free; menuOpen = null; drawLife(); });
  }
  const m = html('button', {role : 'menuitemradio', class : a.by === 'mix' ? 'pick' : '', 'data-stuff' : 'mix'}, menu);
  stuffDot(m, 'mix'); html('span', {}, m, 'Mischung');
  m.addEventListener('click', () => { a.by = 'mix'; drawLife(); });
  if (a.by === 'mix') mixWheel(menu);
  html('hr', {}, menu);
  const h = html('button', {role : 'menuitem', 'data-stuff' : 'hormones'}, menu);
  html('span', {class : 'soft'}, h, 'Zur Hormonansicht …');
  h.addEventListener('click', () => { h.lastChild.textContent = 'öffnet im Atelier die Hormonansicht'; });
}
// The wheel in the button: the place the cell listens from and how wide it listens.
const wheels = new Set();
function mixWheel(menu) {
  const svg = el('svg', {viewBox : '0 0 150 150', 'data-mix' : 1}, null); menu.appendChild(svg);
  const C = 75, R = 52, P = (x, y) => [C + R * x, C - R * y];
  const paint = () => {
    svg.replaceChildren();
    const w = mixWeights(), m = life.mix, [mx, my] = P(m.x, m.y), sigma = .15 + 1.85 * m.width;
    el('circle', {cx : C, cy : C, r : R, fill : 'none', stroke : '#2d5059'}, svg);
    WHEEL.forEach((deg, k) => {
      const r = deg * Math.PI / 180, [x, y] = P(Math.cos(r), Math.sin(r)), named = k === 6 || STUFF[k].name;
      el('circle', {cx : x, cy : y, r : 4 + 6 * w[k], fill : k === 6 ? '#e9e2c6' : named ? PALETTE[k] : 'none', stroke : named ? 'none' : '#9fbcbc', 'stroke-dasharray' : named ? '' : '2 2', opacity : .3 + .7 * w[k]}, svg);
      if (k === 6) txt(svg, x, y + 18, 'Reife', {'text-anchor' : 'middle'});
    });
    el('circle', {cx : mx, cy : my, r : R * sigma, fill : '#f1dda6', 'fill-opacity' : .07, stroke : '#f1dda6', 'stroke-dasharray' : '3 3'}, svg);
    const place = el('circle', {cx : mx, cy : my, r : 6}, svg);
    drag(svg, place, p => { const x = (p.x - C) / R, y = (C - p.y) / R, n = Math.hypot(x, y); life.mix.x = n > 1.1 ? x / n * 1.1 : x; life.mix.y = n > 1.1 ? y / n * 1.1 : y; drawDiagrams(); refreshDots(); }, 'mixplace');
    const wx = Math.min(146, mx + R * sigma);
    const width = el('rect', {x : wx - 5, y : my - 5, width : 10, height : 10, rx : 2}, svg);
    drag(svg, width, p => { life.mix.width = clamp(((p.x - mx) / R - .15) / 1.85, 0, 1); drawDiagrams(); refreshDots(); }, 'mixwidth');
  };
  paint(); wheels.add({svg, paint});
  return svg;
}
const refreshDots = () => document.querySelectorAll('#triggers .seg .sdot, #stuffs h4 .sdot').forEach(d => { if (d.dataset.mix) d.style.background = mixPaint(); });
function drawLife() { drawTriggers(); drawDiagrams(); }
// The pictures are kept between redraws, so that a drag inside one stays held.
function drawDiagrams() {
  diagram(document.getElementById('life'), 'maturity');
  const box = document.getElementById('stuffs');
  const used = [...new Set(ACTIONS.map(([k]) => source(life[k])).filter(b => b !== 'auto' && b !== 'maturity'))];
  for (const old of [...box.children]) if (!used.includes(old.dataset.by)) old.remove();
  for (const by of used) {
    let part = box.querySelector(`[data-by="${by}"]`);
    if (!part) {
      part = html('div', {'data-by' : by}, box); html('h4', {}, part);
      // A mix is set where it is used, too: its wheel above its picture.
      if (by === 'mix') { const wsvg = mixWheel(part); wsvg.style.width = '150px'; wsvg.style.margin = '0 auto'; }
      part.appendChild(el('svg', {id : 'life-' + by}));
    }
    const h = part.firstChild; h.replaceChildren();
    const d = stuffDot(h, by); if (by === 'mix') d.dataset.mix = 1;
    const mine = ACTIONS.filter(([k]) => source(life[k]) === by).map(([, name]) => name);
    h.append((mine.length === 3 ? 'Lebenszyklus' : mine.join(' und ')) + ' durch ' + sourceName(by, true));
    diagram(part.lastChild, by);
  }
  for (const w of [...wheels]) { if (w.svg.isConnected) w.paint(); else wheels.delete(w); }
}
function stageIcon(svg, kind, x, cy, s) {
  const line = {fill : 'none', stroke : '#e9e2c6', 'stroke-width' : 1.6};
  if (kind === 'egg') el('ellipse', {cx : x, cy, rx : 14 * s, ry : 18 * s, ...line}, svg);
  else if (kind === 'hatch') {
    el('path', {d : `M${x - 13 * s} ${cy + 4 * s} a${13 * s} ${14 * s} 0 0 0 ${26 * s} 0 l${-6.5 * s} ${-5 * s} ${-6.5 * s} ${5 * s} ${-6.5 * s} ${-5 * s} ${-6.5 * s} ${5 * s} z`, ...line}, svg);
    el('path', {d : `M${x - 8 * s} ${cy - 9 * s} q${8 * s} ${-11 * s} ${16 * s} 0 q${-8 * s} ${9 * s} ${-16 * s} 0 z`, ...line}, svg);
  } else {
    const w = 14 * s, h = 6 * s;
    el('path', {d : `M${x - w} ${cy} Q${x} ${cy - h * 1.6} ${x + w} ${cy} Q${x} ${cy + h * 1.6} ${x - w} ${cy} Z M${x + w} ${cy} l${5 * s} ${-4 * s} v${8 * s} Z`, ...line}, svg);
  }
}
function diagram(svg, by) {
  svg.replaceChildren();
  const stuff = by !== 'maturity', colour = stuff ? sourceColour(by) : null;
  const b = life.become, w = life.work, d = life.die, here = a => source(a) === by;
  const plain = stuff && !here(w);
  const L = 14, R = 286, X = c => L + (R - L) * clamp(c, 0, 1), top = 22, base = plain ? 54 : 160;
  const Y = v => base - (base - top) * v, fit = p => clamp((p.x - L) / (R - L), 0, 1), lift = p => clamp((base - p.y) / (base - top), 0, 1);
  if (!stuff) {
    // The life: egg, hatching, young fish, adult, drawn into the field itself.
    el('rect', {x : L, y : top, width : R - L, height : base - top, fill : '#112f37'}, svg);
    el('rect', {x : L, y : top, width : X(life.hatch) - L, height : base - top, fill : '#1d4149'}, svg);
    const mid = (top + base) / 2;
    // Three phases; hatching is the step between the first two and needs no word.
    const young = (life.hatch + ADULT) / 2, grown = .8;
    stageIcon(svg, 'egg', X(life.hatch / 2), mid, 1);
    stageIcon(svg, 'hatch', X(life.hatch), mid, .6);
    stageIcon(svg, 'young', X(young), mid, 1.25);
    stageIcon(svg, 'adult', X(grown), mid, 2.1);
    for (const [c, word] of [[life.hatch / 2, 'Ei'], [young, 'Jungfisch'], [grown, 'erwachsen']]) txt(svg, X(c), base + 16, word, {'text-anchor' : 'middle'});
  } else {
    const id = 'lv' + by, grad = el('linearGradient', {id}, el('defs', {}, svg));
    el('stop', {offset : 0, 'stop-color' : colour, 'stop-opacity' : .04}, grad);
    el('stop', {offset : 1, 'stop-color' : colour, 'stop-opacity' : .5}, grad);
    el('rect', {x : L, y : top, width : R - L, height : base - top, fill : `url(#${id})`}, svg);
    const under = base + 16;
