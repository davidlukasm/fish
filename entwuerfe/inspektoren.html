<meta charset="utf-8">
<title>Muster-Inspektoren Atelier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: three inspector panels at their real 320 px width, side by side, as in the atelier. */
:root{color-scheme:dark;--ground:#09212a;--panel:#143039;--edge:#2d5059;--text:#d7e6e3;--soft:#9fbcbc;--axis:#a7c2be;
  --handle:#f1dda6;--handle-core:#153a40;--teal:#79d2be;--motor:#eaa886;--gut:#d9cfae;--cost:#e8a2b5;
  --eggs:#d4b7ee;--fish:#8ac7bb;--track:#0f2c34}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:14px/1.45 system-ui,sans-serif}
main{display:flex;flex-wrap:wrap;gap:24px;padding-block:20px;align-items:flex-start}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{width:320px;max-width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px 10px 14px}
.panel h2{margin:0 0 2px 2px;font:500 12px/1.3 system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.panel h3{margin:0 0 6px 2px;font:400 21px/1.2 Georgia,serif;color:#eef4ec}
svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;overflow:visible}
svg text{fill:var(--axis);font-size:11px}
svg text.value{fill:var(--text);font-variant-numeric:tabular-nums}
.grip{fill:var(--handle-core);stroke:var(--handle);stroke-width:2.2;cursor:grab}
.grip:hover,.grip.dragging{stroke:#fff3c4;stroke-width:3}
.grip.dragging{cursor:grabbing}
.chip{cursor:pointer}
.panel h4{margin:16px 0 4px 0;padding-top:8px;border-top:1px solid var(--edge);font:600 13px/1.3 system-ui;color:#eef4ec;display:flex;align-items:center;gap:7px}
.panel h4.first{border-top:0;padding-top:0;margin-top:6px}
</style>
<main>
  <section class="panel" aria-label="Darm">
    <h2>Organ</h2><h3>Darm</h3>
    <h4 id="gut-kind" class="first">Allesfresser</h4>
    <svg id="fish"></svg>
    <h4>Ertrag</h4>
    <svg id="yield"></svg>
    <svg id="life"></svg>
    <svg id="bars"></svg>
    <h4>Sättigungsgefühl</h4>
    <svg id="full"></svg>
    <h4>Bauchweh</h4>
    <svg id="ache"></svg>
    <h4>Nährgefühl</h4>
    <svg id="feed"></svg>
  </section>
</main>
<script>
'use strict';
// The page has three layers, in this order:
//   settings  S: what the player sets, nothing derived;
//   model     pure functions of S; M() is their result for the present settings, worked out once
//             per change and read by every picture, so that no number can differ from its curve;
//   pictures  each built once (what never changes) and repainted only where it shows a setting
//             that changed, at most once per frame.

// ===== Helpers =====
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.appendChild(e); return e; };
const txt = (parent, x, y, s, attrs = {}) => { const t = el('text', {x, y, ...attrs}, parent); t.textContent = s; return t; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const path = pts => 'M' + pts.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(' L');
// A grip is made anew whenever its picture is repainted; the pointer is held by the picture itself,
// and the grip in hand is found again by its name.
let held = null;
function drag(svg, grip, move, name) {
  grip.classList.add('grip'); grip.setAttribute('data-name', name);
  if (held?.svg === svg && held.name === name) grip.classList.add('dragging');
  grip.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); svg.setPointerCapture(e.pointerId); held = {svg, name}; grip.classList.add('dragging');
    const at = ev => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
    const onMove = ev => move(at(ev));
    const up = () => {
      held = null;
      svg.removeEventListener('pointermove', onMove); svg.removeEventListener('pointerup', up); svg.removeEventListener('pointercancel', up);
      for (const g of svg.querySelectorAll('.dragging')) g.classList.remove('dragging');
    };
    svg.addEventListener('pointermove', onMove); svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  });
}
// A round button; `parts` are the pictures its action changes.
function chip(parent, x, y, sign, act, parts, enabled = true, r = 7) {
  const g = el('g', {class : 'chip', opacity : enabled ? 1 : .3}, parent), d = r * .45, red = sign === '×';
  el('circle', {cx : x, cy : y, r, style : `fill:${COLOUR.track};stroke:${red ? COLOUR.remove : COLOUR.chipEdge};stroke-width:1.4`}, g);
  el('path', {d : red ? `M${x - d * .8} ${y - d * .8} l${1.6 * d} ${1.6 * d} m0 ${-1.6 * d} l${-1.6 * d} ${1.6 * d}` : `M${x - d} ${y} h${2 * d}` + (sign === '+' ? ` M${x} ${y - d} v${2 * d}` : ''), stroke : red ? COLOUR.remove : COLOUR.chipSign, 'stroke-width' : 1.5, 'stroke-linecap' : 'round'}, g);
  if (enabled) g.addEventListener('click', e => { e.stopPropagation(); act(); draw(parts); });
}
function stageIcon(parent, kind, x, cy, s) {
  const line = {fill : 'none', stroke : COLOUR.icon, 'stroke-width' : 1.6};
  if (kind === 'hatch') {
    el('path', {d : `M${x - 13 * s} ${cy + 4 * s} a${13 * s} ${14 * s} 0 0 0 ${26 * s} 0 l${-6.5 * s} ${-5 * s} ${-6.5 * s} ${5 * s} ${-6.5 * s} ${-5 * s} ${-6.5 * s} ${5 * s} z`, ...line}, parent);
    el('path', {d : `M${x - 8 * s} ${cy - 9 * s} q${8 * s} ${-11 * s} ${16 * s} 0 q${-8 * s} ${9 * s} ${-16 * s} 0 z`, ...line}, parent);
  } else { const w = 14 * s, h = 6 * s; el('path', {d : `M${x - w} ${cy} Q${x} ${cy - h * 1.6} ${x + w} ${cy} Q${x} ${cy + h * 1.6} ${x - w} ${cy} Z M${x + w} ${cy} l${5 * s} ${-4 * s} v${8 * s} Z`, ...line}, parent); }
}
const fibreColour = f => { const lo = [184, 68, 63], hi = [242, 235, 226]; return 'rgb(' + lo.map((v, i) => Math.round(v + (hi[i] - v) * f)).join(',') + ')'; };
const keyColour = i => ['#79d2be', '#5fb3a8', '#a6e3d3'][i % 3];
const STOMACH_FILL = '#c98f55', STOMACH_EDGE = '#e6b47c', TUBE = '#6b6f5f', MUSCLE = '#9a6a48';
const COLOUR = {axis : '#3b6a6c', track : '#0f2c34', trackEdge : '#2d5059', line : '#f4efd8', handle : '#f1dda6', chosen : '#ffffff', unchosen : '#0d262c',
                sore : '#ef8f8f', stomachBack : '#5a4232', morsel : '#e3cf94', body : '#16363e', icon : '#e9e2c6', chipEdge : '#5d8384', chipSign : '#d7e6e3', remove : '#e8a2b5'};

// ===== Settings =====
const S = {
  length : 1.4,
  nodes : [{strength : .5, fast : .3}, {strength : .35, fast : .75}], chosen : 0,
  from : .1, until : 1,
  stomach : .45,
  full : {keys : [{gate : .6, spread : .1}], chosen : 0, input : {rise : 40, height : .8, stop : 180}, getsUsed : false},
  ache : {keys : [{gate : .3, spread : .1, used : 60}], chosen : 0, input : {rise : 15, height : .7, stop : 160}, getsUsed : true},
  feed : {keys : [{gate : .25, spread : .1, used : 60}], chosen : 0, input : {rise : 10, height : .6, stop : 60}, getsUsed : true}
};

// ===== The model: the one source for every picture and number =====
// Engine (Fable FAKTEN 9): the gut's length is set once at birth; at rest a meal stays 200 steps
// per unit of length (0.5 to 4). Its muscle, an organ of its own, drives the contents up to four
// times as fast: its nodes add up, each with its fibres; over the life it works from the maturity
// its nodes start at to the one they die at, and drives the more strongly the bigger the body.
// Within each twitch the stay swings between rest and twice the mean pace.
const SHORTEST = .5, LONGEST = 4, REST_PER_LENGTH = 200, FASTEST = 4;
// The stays the pictures show.
const SHORT = 50, LONG = 800;
// How the nodes' strengths become the muscle's drive: a node of enduring fibres pushes FIBRE_PUSH[0]
// of its strength, one of strong fibres FIBRE_PUSH[1]; the drive nears FASTEST as their sum grows.
const FIBRE_PUSH = [.6, 1.4], DRIVE_GAIN = 1.6;
const muscleSum = () => S.nodes.reduce((t, n) => t + n.strength * (FIBRE_PUSH[0] + (FIBRE_PUSH[1] - FIBRE_PUSH[0]) * n.fast), 0);
const driveOf = sum => 1 + (FASTEST - 1) * (1 - Math.exp(-DRIVE_GAIN * sum));
const sumForDrive = d => -Math.log(1 - (d - 1) / (FASTEST - 1)) / DRIVE_GAIN;
const bodyDrive = s => { const push = r => r / (r + .5); return Math.pow(push(2 / 3 + s / 3) / push(1), 2); };
const LIFE = Array.from({length : 61}, (_, k) => k / 60);

// Foods by their stuffs. Each stuff: steps to break half of it open (0: open at once), steps to
// take it up, steps after which it spoils as fast as it is taken up (0: never), and the share that
// can be taken up at best. The values meet David's numbers (FEEDBACK-1311, line 12): leaf at best
// 92 %, meat 82 %, plankton 72 %, algae 78 % and held from about 630 steps to the long end; at the
// left edge (50 steps) algae 18 % and plankton 34 %.
//
// PROPOSAL TO THE ENGINE: this is not what the engine computes today.
//   stuff   here                        engine today (src/protocol_schema.hh:2024-2037)
//   flesh   opens 0, up 20, spoils 250  the same
//   pulp    0, 33, 800                  0, 8, 720
//   shell   100, 4, 480, at best 86 %   80, 20, 330
//   hard    430, 2, never               fibre 400, 20, never
//   soft    230, 4, never, 78 %         none: algae are 82 % of the one fibre
//   sap     0, 20, never                none: algae's quick part is the pulp of flocks
//   foods   leaf hard 1; algae sap .25, soft .70; flocks pulp .77; plankton flesh .445, shell .52
//           engine (src/physiology.hh:183-200): leaf fibre 1; algae pulp .18, fibre .82; flocks
//           pulp .62, fibre .10; plankton flesh .5, shell .5
//   The formula is the engine's (stuff_yield, src/physiology.hh:229-234) with one addition: the
//   share taken up at best. With it the engine can give these curves; it needs two more stuffs.
//   Algae hold their 78 % to the long end only because their quick part (sap) never spoils. With
//   the pulp of flocks, which must spoil so that flocks fall off, they cannot.
//   Bellyache below is a formula of its own; the engine's has other limits and another shape
//   (gut_ache, src/physiology.hh:374-379: meat from stay x share 375, fibre above 55 % below
//   400 x the excess).
const STUFFS = {flesh : [0, 20, 250, 1], shell : [100, 4, 480, .86], pulp : [0, 33, 800, 1], sap : [0, 20, 0, 1], soft : [230, 4, 0, .78], hard : [430, 2, 0, 1]};
const FOOD = [['Blatt', {hard : 1}, '#8fd16a'], ['Alge', {sap : .25, soft : .7}, '#55c4a6'], ['Flocken', {pulp : .77}, '#e3cf94'], ['Plankton', {flesh : .445, shell : .52}, '#9cc8f0'], ['Fleisch', {flesh : 1}, '#ef8f8f']];
const KIND = {Blatt : 'Pflanzenfresser', Alge : 'Algenfresser', Flocken : 'Allesfresser', Plankton : 'Planktonfresser', Fleisch : 'Räuber'};
function stuffYield(t, [opens, uptake, spoils, eff]) {
  const k = 1 / uptake, r = opens > 0 ? Math.min(1, Math.pow(t / opens, 4) / t) : Infinity, open = opens > 0 ? r / (r + 1 / t) : 1;
  const sp = spoils > 0 ? Math.min(1, Math.pow(t / spoils, 4) / uptake) : 0;
  return eff * open * k / (k + sp + 1 / t);
}
const gain = (f, t) => Object.entries(f).reduce((a, [s, share]) => a + share * stuffYield(t, STUFFS[s]), 0);
// Bellyache of a full gut of a food at a stay: meat spoils when it stays long, fibre that passes
// unopened hurts when it stays short. Flocks never hurt.
function ache(f, t) {
  const flesh = f.flesh ?? 0, fibre = (f.hard ?? 0) + (f.soft ?? 0);
  const rot = flesh > 0 ? clamp((t - (140 + 380 * (1 - flesh))) / 180, 0, 1) * Math.sqrt(flesh) : 0;
  const onset = fibre > .4 ? 360 * (fibre - .4) / .6 : 0;
  const raw = onset > 0 ? clamp((onset - t) / (.6 * onset), 0, 1) : 0;
  return Math.max(rot, raw);
}
const HURTS = .15;
// What does not depend on the settings: every food's yield and ache along the pictures' time axis.
const AXIS = Array.from({length : 141}, (_, k) => SHORT * Math.pow(LONG / SHORT, k / 140));
const CURVES = FOOD.map(([name, f, colour]) => {
  const gains = AXIS.map(t => gain(f, t));
  return {name, f, colour, gains, aches : AXIS.map(t => ache(f, t)), best : Math.max(...gains)};
});
// What a food gives within a window of stays, where a full gut of it hurts there, and how much.
function rangeIn(c, [lo, hi]) {
  const gains = [gain(c.f, lo), gain(c.f, hi)], aches = [ache(c.f, lo), ache(c.f, hi)];
  AXIS.forEach((t, k) => { if (t >= lo && t <= hi) { gains.push(c.gains[k]); aches.push(c.aches[k]); } });
  const sore = gains.filter((_, k) => aches[k] > HURTS);
  return {min : Math.min(...gains), max : Math.max(...gains), sore : sore.length ? [Math.min(...sore), Math.max(...sore)] : null,
          ache : [Math.min(...aches), Math.max(...aches)]};
}
// Everything the pictures read, for the present settings.
function derive() {
  const rest = REST_PER_LENGTH * S.length, drive = driveOf(muscleSum());
  const paceAt = s => s >= S.from && s <= S.until ? 1 + (drive - 1) * bodyDrive(s) : 1;
  const meanAt = s => rest / paceAt(s), swingAt = s => rest / (1 + 2 * (paceAt(s) - 1));
  // Every stay this fish's gut ever has: from the shortest swing over its life to rest. The
  // pictures start at SHORT, so the window does too.
  const stays = [Math.max(SHORT, Math.min(...LIFE.map(swingAt))), rest];
  const ranges = CURVES.map(c => rangeIn(c, stays));
  // The kind: the food that pays best somewhere in this fish's life.
  const top = ranges.reduce((b, r, i) => r.max > ranges[b].max ? i : b, 0);
  return {rest, drive, meanAt, swingAt, window : stays, ranges, kind : KIND[CURVES[top].name]};
}
let model = null;
const M = () => model ??= derive();

// ===== Pictures: built once, repainted where the settings changed =====
// A picture has what never changes (built once) between a layer below it and one above it; only
// those two layers are repainted. Its height is fixed, so nothing below it moves.
const pictures = {};
function picture(id, height, build) {
  let p = pictures[id];
  if (!p) {
    const svg = document.getElementById(id);
    svg.setAttribute('viewBox', `0 0 300 ${height}`);
    const under = el('g', {}, svg), fixed = el('g', {}, svg), live = el('g', {}, svg);
    p = pictures[id] = {svg, under, live};
    build?.(fixed, svg);
  }
  p.under.replaceChildren(); p.live.replaceChildren();
  return p;
}
// Which pictures show which settings.
const EVERY = ['fish', 'yield', 'life', 'bars', 'full', 'ache', 'feed'];
const SHOW_MUSCLE = ['fish', 'yield', 'life', 'bars', 'ache', 'feed'], SHOW_WORKING_LIFE = ['yield', 'life', 'bars', 'ache', 'feed'];
const SHOW_SATIETY_KEYS = ['fish', 'full'];
const dirty = new Set();
let queued = 0;
// A setting has changed: its pictures are repainted in the next frame, however often this is
// called before.
function draw(parts = EVERY) {
  model = null;
  for (const part of parts) dirty.add(part);
  queued ||= requestAnimationFrame(repaint);
}
function repaint() {
  queued = 0;
  document.getElementById('gut-kind').textContent = M().kind;
  for (const part of dirty) PAINT[part]();
  dirty.clear();
}

// ===== The fish: stomach, gut and its muscle =====
// The whole width. The stomach holds the satiety thresholds (keys at the left, (+)/(−) below it);
// the gut loops from the stomach to the vent, as long as it is (its end is dragged); its wall is
// the muscle, brown, squeezing in waves as strong as the muscle. Under the fish the muscle's nodes
// as in the tail: colour = fibres, height = strength; their fibres on the bar below.
const BODY = 'M14 64 Q30 26 110 22 Q200 22 236 52 L284 28 Q276 64 284 100 L236 76 Q200 112 110 108 Q30 104 14 64 Z';
// The fish lies FISH_DOWN below the line of costs.
const FISH_DOWN = 10, STOMACH = {x : 92, y : 64, rx : 26, ry : 24}, VENT = [232, 92];
const GUT_LEFT = 126, GUT_RIGHT = [150, 226];
const NODES = {x0 : 14, x1 : 262, base : 172, low : 6, tall : 34}, FIBRES = {x0 : 14, x1 : 286, y : NODES.base + 22};
const KEY_X = 34;
const gutEnd = () => GUT_RIGHT[0] + (GUT_RIGHT[1] - GUT_RIGHT[0]) * (S.length - SHORTEST) / (LONGEST - SHORTEST);
function stomachPath(c) {
  const {x, y, rx : w, ry : h} = c;
  return `M${x - .55 * w} ${y - h} C${x - 1.05 * w} ${y - .6 * h} ${x - 1.1 * w} ${y + .55 * h} ${x - .35 * w} ${y + h}`
       + ` C${x + .35 * w} ${y + 1.12 * h} ${x + 1.05 * w} ${y + .55 * h} ${x + w} ${y - .05 * h}`
       + ` C${x + .95 * w} ${y - .55 * h} ${x + .45 * w} ${y - .55 * h} ${x + .2 * w} ${y - .75 * h}`
       + ` C${x + .05 * w} ${y - .9 * h} ${x - .2 * w} ${y - 1.05 * h} ${x - .55 * w} ${y - h} Z`;
}
function gutWay() {
  const right = gutEnd(), folds = Math.max(2, Math.round(1 + S.length * 1.4)), high = 42, low = 98;
  const pts = [[STOMACH.x + STOMACH.rx - 4, STOMACH.y - 6], [GUT_LEFT, high + 4]], step = (right - GUT_LEFT) / (folds - 1);
  for (let f = 0; f < folds; f++) {
    const x = GUT_LEFT + step * f, down = f % 2 === 0;
    for (let k = 0; k <= 12; k++) pts.push([x, down ? high + (low - high) * k / 12 : low - (low - high) * k / 12]);
    if (f < folds - 1) for (let k = 1; k <= 8; k++) { const t = Math.PI * k / 8; pts.push([x + step / 2 - step / 2 * Math.cos(t), (down ? low : high) + (down ? 1 : -1) * Math.min(9, step * .7) * Math.sin(t)]); }
  }
  const [lx, ly] = pts.at(-1);
  for (let k = 1; k <= 10; k++) pts.push([lx + (VENT[0] - lx) * k / 10, ly + (VENT[1] - ly) * k / 10]);
  const lengths = [0];
  for (let i = 1; i < pts.length; i++) lengths.push(lengths[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const at = u => { const d = clamp(u, 0, 1) * lengths.at(-1); let i = 1; while (i < lengths.length - 1 && lengths[i] < d) i++;
    const t = (d - lengths[i - 1]) / (lengths[i] - lengths[i - 1] || 1); return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]; };
  return {at, end : [right, low]};

// The moving gut: its wall and tube in SEGMENTS pieces whose widths the waves change, and the
// morsels that travel along it. It outlives every repaint; only a new length lays it anew.
const SEGMENTS = 120, WAVES = 7, WAVE_PACE = .00012, WALL = [11, 6], TUBE_WIDTH = [6, -4.5];
const film = {wall : null, tube : null, keys : null, segs : [], bits : [], way : null, length : null, t : 0, last : 0, seen : true};
// What the gut costs, as the engine charges it. Per unit of its length the basal need rises by
// GUT_UPKEEP and the tissue weighs GUT_WALL more; the longest gut leaves the eggs GUT_BELLY less
// room (digestion::upkeep, wall_mass, belly; src/physiology.cc:132, 432, src/physiology.hh:213-217).
// A muscle node's upkeep is MUSCLE_UPKEEP per unit of its tissue (a full node has MUSCLE_TISSUE),
// times what its fibres need, against the basal need BASAL (src/brain_interface.hh:164,
// src/body_plan.cc:54-58, src/physiology_parameters.hh:27; fibres src/protocol_schema.hh:2018-2019).
const GUT_UPKEEP = .1, GUT_WALL = .05, GUT_BELLY = .25, MUSCLE_UPKEEP = .0004, MUSCLE_TISSUE = 4, BASAL = .06;
const FIBRE_UPKEEP = [1.2, .3];
const fibreUpkeep = fast => FIBRE_UPKEEP[0] * Math.pow(FIBRE_UPKEEP[1] / FIBRE_UPKEEP[0], fast);
function buildFish(fixed, svg) {
  const defs = el('defs', {}, svg);
  el('clipPath', {id : 'fishstomach'}, defs).appendChild(el('path', {d : stomachPath(STOMACH)}));
  const grad = el('linearGradient', {id : 'fibregrad'}, defs);
  el('stop', {offset : 0, 'stop-color' : fibreColour(0)}, grad); el('stop', {offset : 1, 'stop-color' : fibreColour(1)}, grad);
  el('path', {d : BODY, transform : `translate(0 ${FISH_DOWN})`, fill : COLOUR.body, stroke : COLOUR.axis}, fixed);
  const g = el('g', {transform : `translate(0 ${FISH_DOWN})`}, fixed), st = STOMACH;
  el('path', {d : `M${st.x - 22} ${st.y - 30} Q${st.x - 18} ${st.y - 18} ${st.x - 12} ${st.y - 22}`, stroke : TUBE, 'stroke-width' : 5, fill : 'none', 'stroke-linecap' : 'round'}, g);
  // The wall (muscle) under the tube; both belong to the film.
  film.wall = el('g', {}, g); film.tube = el('g', {}, g);
  film.bits = Array.from({length : 7}, (_, k) => ({u : k / 7, e : el('circle', {r : 2.6, fill : COLOUR.morsel}, g)}));
  // The stomach with its content.
  const top = st.y + st.ry - 2 * st.ry * S.stomach;
  el('path', {d : stomachPath(st), fill : COLOUR.stomachBack}, g);
  el('rect', {x : st.x - st.rx, y : top, width : 2 * st.rx, height : st.y + st.ry - top, fill : STOMACH_FILL, opacity : .85, 'clip-path' : 'url(#fishstomach)'}, g);
  el('path', {d : stomachPath(st), fill : 'none', stroke : STOMACH_EDGE, 'stroke-width' : 1.6}, g);
  film.keys = el('g', {}, g);
  el('rect', {x : FIBRES.x0, y : FIBRES.y - 4, width : FIBRES.x1 - FIBRES.x0, height : 8, rx : 4, fill : 'url(#fibregrad)', opacity : .85}, fixed);
  txt(fixed, FIBRES.x0, FIBRES.y - 9, 'ausdauernd'); txt(fixed, FIBRES.x1, FIBRES.y - 9, 'kräftig', {'text-anchor' : 'end'});
}
function layGut() {

    const y = IY(k.gate), chosen = i === cell.chosen;
    el('path', {d : `M${LX + 10} ${y} H${R}`, stroke : keyColour(i), 'stroke-dasharray' : '4 3', 'stroke-width' : chosen ? 1.8 : 1.1}, live);
    drag(svg, el('rect', {x : LX - 8, y : y - 4, width : 18, height : 8, rx : 2, style : `fill:${keyColour(i)};stroke:${chosen ? COLOUR.chosen : COLOUR.unchosen};stroke-width:${chosen ? 2 : 1}`}, live),
      p => { k.gate = clamp(vOf(p.y), .03, .97); cell.chosen = i; draw(o.shows); }, id + 'key' + i);
  });
  {
    const k = keys[cell.chosen], gates = cellGates(k), x = LX + 16, ytop = IY(Math.max(...gates)), ybot = IY(Math.min(...gates));
    el('path', {d : `M${x} ${ytop} V${ybot}`, stroke : keyColour(cell.chosen), 'stroke-width' : 3, 'stroke-linecap' : 'round'}, live);
    drag(svg, el('rect', {x : x - 5, y : ytop - 9, width : 10, height : 8, rx : 3, style : `stroke:${keyColour(cell.chosen)}`}, live), p => { k.spread = clamp(2 * (vOf(p.y + 5) - k.gate), 0, .8); draw([id]); }, id + 'spread');
    if (keys.length > 1) chip(live, x + 13, IY(k.gate), '×', () => { keys.splice(cell.chosen, 1); cell.chosen = 0; }, o.shows, true, 6);
  }
  chip(live, LX, I1 + 14, '+', () => { keys.push({gate : clamp((Math.max(...keys.map(k => k.gate)) + 1) / 2, .05, .95), spread : .1, ...(cell.getsUsed ? {used : 60} : {})}); cell.chosen = keys.length - 1; }, o.shows, keys.length < 3);
  // What each food gives these cells.
  if (o.row) {
    const BY = v => B1 - (B1 - B0) * clamp(v, 0, 1), bw = (R - L) / FOOD.length, ranges = M().ranges;
    txt(live, L, B0 - 4, o.row.word);
    CURVES.forEach((c, j) => {
      const [lo, hi] = o.row.of(ranges[j]), x = L + bw * j + 3, w = bw - 6;
      el('rect', {x, y : B0, width : w, height : B1 - B0, rx : 2, fill : COLOUR.track, stroke : COLOUR.trackEdge}, live);
      el('rect', {x, y : BY(lo), width : w, height : B1 - BY(lo), rx : 2, fill : c.colour, opacity : .85}, live);
      el('rect', {x, y : BY(hi), width : w, height : Math.max(0, BY(lo) - BY(hi)), fill : c.colour, opacity : .4}, live);
      txt(live, x + w / 2, B1 + 11, c.name, {'text-anchor' : 'middle', style : `fill:${c.colour};font-size:10px`});
    });
    keys.forEach((k, i) => el('path', {d : `M${L} ${BY(k.gate)} H${R}`, stroke : keyColour(i), 'stroke-dasharray' : '4 3', 'stroke-width' : i === cell.chosen ? 1.6 : 1}, live));
  }
  // The report to the brain over the same time.
  const most = keys.length, AY = v => A1 - (A1 - A0) * v / most;
  txt(live, L, A0 - 5, 'Meldung an das Gehirn');
  const reports = keys.map(k => report(id, k, stim));
  let under = Array(N + 1).fill(0);
  keys.map((k, i) => i).sort((a, b) => keys[a].gate - keys[b].gate).forEach(i => {
    const over = under.map((u, st) => u + reports[i][st]);
    const band = el('path', {d : `${path(over.map((v, st) => [X(st), AY(v)]))} L${back(under.map((v, st) => [X(st), AY(v)]))} Z`, fill : keyColour(i), opacity : i === cell.chosen ? .85 : .55, class : 'chip'}, live);
    band.addEventListener('pointerdown', () => { cell.chosen = i; draw(o.shows); });
    under = over;
  });
  el('path', {d : `M${L} ${A0 - 2} V${A1} H${R}`, stroke : COLOUR.axis, fill : 'none'}, live);
  if (cell.getsUsed) {
    // Half used to it: the cells' adaptation has reached half the stimulus (m += (s − m) / steps).
    const k = keys[cell.chosen], st = Math.min(N, inp.rise + k.used * Math.LN2), x = X(st);
    el('path', {d : `M${x} ${A0} V${A1}`, stroke : keyColour(cell.chosen), 'stroke-dasharray' : '2 3'}, live);
    txt(live, x + (x > (L + R) / 2 ? -6 : 6), A0 + 10, 'halb gewöhnt', {'text-anchor' : x > (L + R) / 2 ? 'end' : 'start', style : 'font-size:10px'});
    drag(svg, el('rect', {x : x - 5, y : A1 - 7, width : 10, height : 14, rx : 3, style : 'stroke:' + keyColour(cell.chosen)}, live), p => { k.used = clamp((stOf(p.x) - inp.rise) / Math.LN2, 4, 1024); draw([id]); }, id + 'used');
  }
  txt(live, L, A1 + 14, 'Schritte');
  for (const st of [100, 200]) txt(live, X(st), A1 + 14, st, {'text-anchor' : 'middle'});
  txt(live, R, A1 + 14, N, {'text-anchor' : 'end'});
}

// ===== Everything from the model =====
const PAINT = {fish : drawFish, yield : drawYield, life : drawLife, bars : drawBars, full : () => drawSense('full'), ache : () => drawSense('ache'), feed : () => drawSense('feed')};
for (const part of EVERY) dirty.add(part);
repaint();
// The gut moves only while it is on the screen, and not for someone who has asked for less motion.
if (typeof IntersectionObserver === 'function') new IntersectionObserver(seen => { film.seen = seen.at(-1).isIntersecting; }).observe(document.getElementById('fish'));
if (typeof matchMedia !== 'function' || !matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(fishFrame);
</script>
