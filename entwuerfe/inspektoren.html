<title>Muster-Inspektoren Atelier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: three inspector panels at their real 320 px width, side by side, as in the atelier. */
:root{color-scheme:dark;--ground:#09212a;--panel:#143039;--edge:#2d5059;--text:#d7e6e3;--soft:#9fbcbc;--axis:#a7c2be;
  --handle:#f1dda6;--handle-core:#153a40;--teal:#79d2be;--motor:#eaa886;--gut:#d9cfae;--cost:#e8a2b5;
  --eggs:#d4b7ee;--fish:#8ac7bb;--track:#0f2c34}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:14px/1.45 system-ui,sans-serif}
main{display:flex;flex-wrap:wrap;gap:24px;padding-block:20px;align-items:flex-start}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{width:320px;max-width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px 10px 14px}
.panel h2{margin:0 0 2px 2px;font:500 12px/1.3 system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.panel h3{margin:0 0 6px 2px;font:400 21px/1.2 Georgia,serif;color:#eef4ec}
svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;overflow:visible}
svg text{fill:var(--axis);font-size:11px}
svg text.head{fill:var(--text);font-size:12px;font-weight:500}
svg text.value{fill:var(--text);font-variant-numeric:tabular-nums}
.grip{fill:var(--handle-core);stroke:var(--handle);stroke-width:2.2;cursor:grab}
.grip:hover,.grip.dragging{stroke:#fff3c4;stroke-width:3}
.grip.dragging{cursor:grabbing}
.chip{cursor:pointer}
.triggers{display:flex;flex-direction:column;gap:5px;margin:4px 0 10px}
.trow{display:flex;align-items:center;gap:3px}
.trow>span{flex:0 0 58px;font-size:12px;color:var(--text)}
.seg{display:flex;flex:1;min-width:0;gap:0;border:1px solid var(--edge);border-radius:14px;background:var(--track);overflow:hidden}
.seg>button{font:12px system-ui;color:var(--axis);background:none;border:0;border-left:1px solid var(--edge);padding:0 8px;height:26px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:3px}
.seg>button:first-child{border-left:0}
.seg>button.auto{flex:0 0 74px}.seg>button.mat{flex:0 0 46px}.seg>button.stuff{flex:1;min-width:0;padding:0 4px;gap:2px}
.seg>button:hover{color:var(--text)}
.seg>button.on{background:#2c5a5e;color:#f4efd8;box-shadow:inset 0 0 0 1.5px var(--handle)}
.seg>button:focus-visible{outline:2px solid var(--handle);outline-offset:-2px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:600 9px system-ui;color:#0d262c;opacity:.4;flex:0 0 auto;transition:transform .1s}
.dot.pick{opacity:1;transform:scale(1.18);box-shadow:0 0 0 1.5px #fff3c4}
.dot:hover{opacity:.85}
.panel h4{margin:14px 0 2px 2px;font:500 12px/1.3 system-ui;color:var(--text)}
.chip rect{fill:var(--track);stroke:var(--edge)}
.chip:hover rect{stroke:var(--handle)}
.note{color:var(--soft);font-size:12px;max-width:1010px;padding-block:0 24px;margin:0}
.note b{color:var(--text);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes squeeze{0%,100%{r:4.6;stroke-width:1.4}40%{r:2.6;stroke-width:3.2}}
</style>
<main>
  <section class="panel" aria-label="Lebenszyklus der Zelle">
    <h2>Zelle</h2><h3>Lebenszyklus der Zelle</h3>
    <div class="triggers" id="triggers"></div>
    <svg id="life" viewBox="0 0 300 262"></svg>
    <div id="stuffs"></div>
  </section>
  <section class="panel" aria-label="Darm">
    <h2>Organ</h2><h3>Darm</h3>
    <svg id="gut" viewBox="0 0 300 430"></svg>

  </section>
  <section class="panel" aria-label="Schwanz">

</main>
<p class="note"><b>Entwurf zum Anklicken.</b> Gezogen wird an den gelben Griffen.</p>
<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const txt = (parent, x, y, s, attrs = {}) => { const t = el('text', {x, y, ...attrs}, parent); t.textContent = s; return t; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pct = x => Math.round(x * 100) + ' %';
// Dragging: the pointer is captured by the drawing itself, which stays while its contents are
// redrawn on every move; the held grip is marked again after each redraw by its name.
let held = null;
function drag(svg, grip, move, name = 'grip' + svg.querySelectorAll('.grip').length) {
  grip.classList.add('grip');
  grip.setAttribute('data-name', name);
  if (held?.svg === svg && held.name === name) grip.classList.add('dragging');
  grip.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    svg.setPointerCapture(e.pointerId);
    held = {svg, name};
    grip.classList.add('dragging');
    const at = ev => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
    const onMove = ev => move(at(ev));
    const up = () => { held = null; svg.removeEventListener('pointermove', onMove); svg.removeEventListener('pointerup', up); svg.removeEventListener('pointercancel', up); svg.querySelectorAll('.dragging').forEach(g => g.classList.remove('dragging')); };
    svg.addEventListener('pointermove', onMove); svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  });
}
// A bar of a share, with its value at the right.
function bar(svg, x, y, w, share, colour, value, name) {
  if (name) txt(svg, 4, y + 10, name);
  el('rect', {x, y, width : w, height : 12, rx : 3, fill : '#0f2c34', stroke : '#2d5059'}, svg);
  el('rect', {x, y, width : w * clamp(share, 0, 1), height : 12, rx : 3, fill : colour, opacity : .75}, svg);
  txt(svg, 296, y + 10, value, {'text-anchor' : 'end', class : 'value'});
}

// ---------- Lebenszyklus ----------
// Three actions: the cell comes into being, it works, it dies. Each is one answer that switches
// once, from a level before to a level after, at a point and with a steepness (hormones.hh:
// x = (c / half)^(2^steepness), answer = before + (after − before)·x / (1 + x)); c is the fish's
// maturity or one messenger's level. "automatisch": the cell is there from the egg on, works
// fully, and never dies before the fish does. The life itself, egg to adult, is the ground the
// curve is drawn on.
const STUFF = [['A', '#e8a2b5'], ['B', '#d4b7ee'], ['C', '#9cc8f0'], ['D', '#8fdcc0'], ['E', '#f0c58a'], ['F', '#c9e58f']];
const ACTIONS = [['become', 'Entstehen'], ['work', 'Aktivität'], ['die', 'Tod']];
const life = {
  hatch : .3,
  become : {by : 'maturity', at : .12, stuff : 0},
  work : {by : 'maturity', at : .7, from : 1, to : .3, steep : 2, stuff : 1},
  die : {by : 'auto', at : .9, stuff : 5}
};
const source = a => a.by === 'stuff' ? 'stuff' + a.stuff : a.by;
const bound = (c, half, steep) => { const x = Math.pow(Math.max(0, c) / half, Math.pow(2, steep)); return x / (1 + x); };
const levelAt = (w, c) => w.from + (w.to - w.from) * bound(c, Math.max(.02, w.at), w.steep);
// The choices: three buttons side by side for each action; the messenger is picked inside the
// third one.
function drawTriggers() {
  const box = document.getElementById('triggers'); box.replaceChildren();
  for (const [key, name] of ACTIONS) {
    const a = life[key], row = document.createElement('div'), seg = document.createElement('div');
    row.className = 'trow'; seg.className = 'seg'; seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', name);
    const label = document.createElement('span'); label.textContent = name;
    const button = (cls, by) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = cls + (a.by === by ? ' on' : '');
      b.dataset.trigger = key; b.dataset.by = by; b.setAttribute('aria-pressed', a.by === by);
      b.addEventListener('click', () => { a.by = by; drawLife(); });
      seg.appendChild(b); return b;
    };
    button('auto', 'auto').textContent = 'automatisch';
    button('mat', 'maturity').textContent = 'Reife';
    const s = button('stuff', 'stuff');
    if (a.by !== 'stuff') s.textContent = 'Botenstoff';
    else STUFF.forEach(([n, colour], i) => {
      const d = document.createElement('span');
      d.className = 'dot' + (i === a.stuff ? ' pick' : ''); d.style.background = colour; d.textContent = n;
      d.dataset.stuff = i; d.setAttribute('role', 'button'); d.setAttribute('aria-label', 'Botenstoff ' + n);
      d.addEventListener('click', e => { e.stopPropagation(); a.by = 'stuff'; a.stuff = i; drawLife(); });
      s.appendChild(d);
    });
    row.append(label, seg); box.appendChild(row);
  }
}
function drawLife() {
  drawTriggers();
  diagram(document.getElementById('life'), 'maturity');
  // A picture of its own for each messenger in use, with the actions it sets off.
  const box = document.getElementById('stuffs'); box.replaceChildren();
  const used = [...new Set(ACTIONS.map(([k]) => source(life[k])).filter(b => b.startsWith('stuff')))];
  for (const by of used) {
    const [n] = STUFF[Number(by.slice(5))];
    const h = document.createElement('h4');
    h.textContent = ACTIONS.filter(([k]) => source(life[k]) === by).map(([, name]) => name).join(', ') + ' abhängig von ' + n;
    const svg = document.createElementNS(NS, 'svg'); svg.id = 'life-' + by;
    box.append(h, svg);
    diagram(svg, by);
  }
}
function stageIcon(svg, kind, x, cy) {
  const line = {fill : 'none', stroke : '#e9e2c6', 'stroke-width' : 1.5};
  if (kind === 'egg') el('ellipse', {cx : x, cy, rx : 8, ry : 10, ...line}, svg);
  else if (kind === 'hatch') {
    el('path', {d : `M${x - 8} ${cy + 2} a8 9 0 0 0 16 0 l-4 -3 -4 3 -4 -3 -4 3 z`, ...line}, svg);
    el('path', {d : `M${x - 5} ${cy - 6} q5 -7 10 0 q-5 6 -10 0 z`, ...line}, svg);
  } else {
    const sz = kind === 'young' ? .75 : 1.25, w = 14 * sz, h = 6 * sz;
    el('path', {d : `M${x - w} ${cy} Q${x} ${cy - h * 1.6} ${x + w} ${cy} Q${x} ${cy + h * 1.6} ${x - w} ${cy} Z M${x + w} ${cy} l${5 * sz} ${-4 * sz} v${8 * sz} Z`, ...line}, svg);
  }
}
function diagram(svg, by) {
  svg.replaceChildren();
  const stuff = by.startsWith('stuff') ? STUFF[Number(by.slice(5))] : null;
  const b = life.become, w = life.work, d = life.die, here = a => source(a) === by;
  const plain = !!stuff && !here(w);
  const L = 14, R = 286, X = c => L + (R - L) * clamp(c, 0, 1), top = 30, base = plain ? 62 : 214;
  const Y = v => base - (base - top) * v, fit = p => clamp((p.x - L) / (R - L), 0, 1);
  // The ground: the fish's life (egg, hatching, young, adult) or the messenger's level.
  if (!stuff) {
    el('rect', {x : L, y : top, width : R - L, height : base - top, fill : '#112f37'}, svg);
    el('rect', {x : L, y : top, width : X(life.hatch) - L, height : base - top, fill : '#1d4149'}, svg);
    el('path', {d : `M${X(life.hatch)} ${top} V${base}`, stroke : '#e9e2c6', opacity : .45}, svg);
    for (const [c, kind, word, anchor] of [[life.hatch * .5, 'egg', 'Ei', 'middle'], [life.hatch, 'hatch', 'Schlupf', 'middle'], [.62, 'young', 'Jungfisch', 'middle'], [.93, 'adult', 'erwachsen', 'end']]) {
      stageIcon(svg, kind, X(c), base + 18);
      txt(svg, kind === 'adult' ? R : X(c), base + 42, word, {'text-anchor' : anchor});
    }
  } else {
    const id = 'lv' + by, grad = el('linearGradient', {id}, el('defs', {}, svg));
    el('stop', {offset : 0, 'stop-color' : stuff[1], 'stop-opacity' : .04}, grad);
    el('stop', {offset : 1, 'stop-color' : stuff[1], 'stop-opacity' : .55}, grad);
    el('rect', {x : L, y : top, width : R - L, height : base - top, fill : `url(#${id})`}, svg);
    txt(svg, L, base + 16, 'wenig ' + stuff[0]); txt(svg, R, base + 16, 'viel ' + stuff[0], {'text-anchor' : 'end'});
  }
  // The cell exists from its coming into being to its death where these are set on this ground;
  // otherwise from the egg on and to the end.
  const from = here(b) ? b.at : 0, to = here(d) ? d.at : 1, working = !plain;
  const level = c => here(w) ? levelAt(w, c) : w.by === 'auto' || stuff ? 1 : .5;
  el('path', {d : `M${L} ${base} H${R}`, stroke : '#5d8384'}, svg);
  if (working) {
    el('path', {d : `M${L} ${top} H${R}`, stroke : '#5d8384', 'stroke-dasharray' : '2 4'}, svg);
    txt(svg, L, top - 6, 'volle Aktivität'); txt(svg, R - 4, base - 6, 'keine Aktivität', {'text-anchor' : 'end'});
  }
  if (working && to > from) {
    const elsewhere = !stuff && w.by === 'stuff';
    let path = `M${X(from)} ${base}`;
    for (let k = 0; k <= 120; k++) { const c = from + (to - from) * k / 120; path += ` L${X(c).toFixed(1)} ${Y(level(c)).toFixed(1)}`; }
    el('path', {d : path + ` L${X(to)} ${base} Z`, fill : elsewhere ? STUFF[w.stuff][1] : '#79d2be', 'fill-opacity' : elsewhere ? .16 : .38, stroke : '#79d2be', 'stroke-width' : 1.8, 'stroke-dasharray' : elsewhere ? '4 4' : 'none'}, svg);
    if (elsewhere) txt(svg, (X(from) + X(to)) / 2, (top + base) / 2 + 30, 'Aktivität abhängig von ' + STUFF[w.stuff][0], {'text-anchor' : 'middle', class : 'value'});
  }
  if (here(b)) {
    const x = X(b.at);
    el('path', {d : `M${x} ${top} V${base}`, stroke : '#e9e2c6', 'stroke-dasharray' : '3 3'}, svg);
    const g = el('path', {d : `M${x} ${base - 15} l-8 13 h16 z`}, svg);
    drag(svg, g, p => { b.at = Math.min(fit(p), here(d) ? d.at - .04 : 1); drawLife(); }, 'become');
    const left = x < 150;
    txt(svg, x + (left ? 11 : -11), base - 5, 'entsteht', {'text-anchor' : left ? 'start' : 'end'});
  }
  if (here(w) && to > from) {
    const g1 = el('circle', {cx : X(from) + 9, cy : Y(level(from)), r : 7}, svg);
    drag(svg, g1, p => { w.from = clamp((base - p.y) / (base - top), 0, 1); drawLife(); }, 'before');
    const g2 = el('circle', {cx : X(to) - 9, cy : Y(level(to)), r : 7}, svg);
    drag(svg, g2, p => { w.to = clamp((base - p.y) / (base - top), 0, 1); drawLife(); }, 'after');
    if (Math.abs(w.to - w.from) > .04) {
      // The switch: where along, and how steep (pulled up: abrupt, down: soft).
      const at = clamp(w.at, from + .02, to - .02), cx = X(at), cy = Y(levelAt(w, at));
      const g3 = el('rect', {x : cx - 6.5, y : cy - 6.5, width : 13, height : 13, transform : `rotate(45 ${cx} ${cy})`}, svg);
      const start = {y : cy, steep : w.steep};
      drag(svg, g3, p => { w.at = clamp(fit(p), from + .02, to - .02); w.steep = clamp(Math.round(start.steep + (start.y - p.y) / 18), 0, 3); drawLife(); }, 'switch');
    }
  }
  if (here(d)) {
    const cx = X(d.at), cy = top - 12;
    el('path', {d : `M${cx} ${cy + 9} V${base}`, stroke : '#e8a2b5', 'stroke-dasharray' : '3 3'}, svg);
    const g = el('circle', {cx, cy, r : 9}, svg);
    el('path', {d : `M${cx - 4} ${cy - 4} l8 8 m0 -8 l-8 8`, stroke : '#e8a2b5', 'stroke-width' : 2, 'pointer-events' : 'none'}, svg);
    drag(svg, g, p => { d.at = Math.max(fit(p), here(b) ? b.at + .04 : .02); drawLife(); }, 'die');
    txt(svg, cx - 13, cy + 4, 'stirbt', {'text-anchor' : 'end'});
  }
  svg.setAttribute('viewBox', `0 0 300 ${base + (stuff ? 22 : 48)}`);
}

// ---------- Darm ----------
// The gut as the engine has it (physiology.hh, Fable 6691345). A mouthful stays T steps:
// T = 200 · size / tempo, size = 0.5 · 8^length, tempo from 1 (muscle at rest) up to the muscle's
// most (at most 2). Of a food with flesh share a the gut takes up
// a·kF/(kF + spoil(T) + 1/T) + (1 − a)·kP/(kP + 1/T), kF = 1/20, kP = 1/250,
// spoil(T) = (T/160)²/160: plants give more the longer they stay, flesh spoils the longer it stays.
// Spoiled matter above 0.3 of the gut's room hurts (gut_irritation): Bauchweh and Durchfall.
// Senses: stretch cells report the gut's fill, half at their threshold (bounded_response); food
// cells report the nourishment flowing in against the resting need, s = flow/(flow + rest), as
// s/(s + threshold + adapted), the adapted level following s with rate 1/τ, τ from 4 to 48 steps
// (cppn_brain.cc, adapted_response).
const gut = {length : .45, speed : 1.6, full : .6, sense : .25, tau : 20};
const FOOD = [['Blatt', 0, '#8fd16a'], ['Alge', .25, '#55c4a6'], ['Flocken', .5, '#e3cf94'], ['Plankton', .75, '#9cc8f0'], ['Fleisch', 1, '#ef8f8f']];
const K = {time : 200, flesh : 1 / 20, plant : 1 / 250, spoil : 160, tolerated : .3, fastest : 2, shortest : 50, longest : 800};
const restTime = L => K.time * .5 * Math.pow(8, L);
const spoilRate = T => Math.pow(T / K.spoil, 2) / K.spoil;
const gain = (a, T) => a * K.flesh / (K.flesh + spoilRate(T) + 1 / T) + (1 - a) * K.plant / (K.plant + 1 / T);
// Spoiled matter as a share of the gut's room in a fish that eats only flesh and keeps its gut full
// (digest_nutrition run to its steady state); a food with flesh share a spoils a times as much.
const ROT = (() => {
  const table = [];
  for (let i = 0; i <= 40; i++) {
    const T = K.shortest * Math.pow(2, 4 * i / 40);
    let F = 1, R = 0, fill = 1;
    for (let s = 0; s < 3000; s++) {
      const held = F + R, p = 1 / T, fl = F * K.flesh, sp = (F - fl) * Math.min(1, spoilRate(T)), left = held - fl, lost = left * p;
      R = (R + sp) * (1 - p); F = (F - fl - sp) * (1 - p); fill *= (left - lost) / held;
      const add = Math.max(0, 1 - fill); F += add; fill += add;
    }
    table.push(R);
  }
  return table;
})();
const rotAt = T => { const at = clamp(Math.log2(T / K.shortest) / 4 * 40, 0, 40), k = Math.floor(at); return ROT[k] + (ROT[Math.min(40, k + 1)] - ROT[k]) * (at - k); };
const hurts = (a, T) => a * rotAt(T) > K.tolerated;
const VENT = [212, 94];
function gutWay(size) {
  // From the stomach in loops down the belly to the vent near the tail.
  const folds = Math.max(1, Math.round(size * 1.6)), left = 92, right = 196, high = 48, low = 96, pts = [[72, 64]];
  const step = (right - left) / Math.max(1, folds);
  for (let f = 0; f < folds; f++) {
    const x = left + step * f, down = f % 2 === 0;
    for (let k = 0; k <= 12; k++) pts.push([x, down ? high + (low - high) * k / 12 : low - (low - high) * k / 12]);
    if (f < folds - 1) for (let k = 1; k <= 8; k++) { const t = Math.PI * k / 8; pts.push([x + step / 2 - step / 2 * Math.cos(t), (down ? low : high) + (down ? 1 : -1) * 7 * Math.sin(t)]); }
  }
  // From the last loop along the belly to the vent.
  const [lx, ly] = pts.at(-1);
  if (ly < low - 1) for (let k = 1; k <= 8; k++) { const t = Math.PI / 2 * k / 8; pts.push([lx + 8 * Math.sin(t), ly + (low - ly) * (1 - Math.cos(t))]); }
  const [bx, by] = pts.at(-1);
  for (let k = 1; k <= 8; k++) pts.push([bx + (VENT[0] - bx) * k / 8, by + (VENT[1] - by) * k / 8]);
  const lengths = [0];
  for (let i = 1; i < pts.length; i++) lengths.push(lengths[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const at = s => { const d = clamp(s, 0, 1) * lengths.at(-1); let i = 1; while (i < lengths.length - 1 && lengths[i] < d) i++;
    const t = (d - lengths[i - 1]) / (lengths[i] - lengths[i - 1] || 1); return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]; };
  return {pts, at};
}
let gutLayer = null, gutRings = null, gutWord = null, morsels = [], dung = [], gutClock = 0, gutSpawn = 0, gutLast = 0;
function drawGut() {
  const svg = document.getElementById('gut'); svg.replaceChildren();
  const T = restTime(gut.length), fast = T / gut.speed;
  // ---- The fish with its gut. ----
  el('path', {d : 'M14 64 Q30 26 110 22 Q200 22 236 52 L284 28 Q276 64 284 100 L236 76 Q200 112 110 108 Q30 104 14 64 Z', fill : '#16363e', stroke : '#3b6a6c'}, svg);
  el('circle', {cx : 34, cy : 56, r : 3.2, fill : '#e9e2c6'}, svg);
  el('path', {d : 'M14 66 L28 66', stroke : '#3b6a6c', 'stroke-width' : 2}, svg);
  const way = gutWay(.5 * Math.pow(8, gut.length)), d = 'M' + way.pts.map(([x, y]) => x.toFixed(1) + ' ' + y.toFixed(1)).join(' L');
  el('path', {d, fill : 'none', stroke : '#d9cfae', 'stroke-width' : 8, 'stroke-linecap' : 'round', 'stroke-linejoin' : 'round', opacity : .45}, svg);
  gutRings = el('g', {}, svg);
  const rings = Math.round((gut.speed - 1) * 14);
  for (let r = 0; r < rings; r++) { const [x, y] = way.at((r + .5) / 14); el('circle', {cx : x, cy : y, r : 4.6, fill : 'none', stroke : '#eaa886', 'stroke-width' : 1.4, opacity : .35}, gutRings); }
  // The stomach, filled as far as its stretch cells take as full; its grip sets that.
  const sx = 62, sy = 64, rx = 18, ry = 16, level = sy + ry - 2 * ry * gut.full;
  el('clipPath', {id : 'stomach'}, el('defs', {}, svg)).appendChild(el('ellipse', {cx : sx, cy : sy, rx, ry}));
  el('rect', {x : sx - rx, y : level, width : 2 * rx, height : sy + ry - level, fill : '#d9cfae', opacity : .5, 'clip-path' : 'url(#stomach)'}, svg);
  el('ellipse', {cx : sx, cy : sy, rx, ry, fill : 'none', stroke : '#d9cfae', 'stroke-width' : 1.6}, svg);
  for (const [cx, cy] of [[sx - rx + 2, sy - 6], [sx + rx - 2, sy + 6]]) el('circle', {cx, cy, r : 2.6, fill : '#f1dda6'}, svg);
  el('path', {d : `M${sx - rx} ${level} H${sx + rx}`, stroke : '#f1dda6', 'stroke-dasharray' : '2 2'}, svg);
  const fg = el('circle', {cx : sx + rx + 2, cy : level, r : 6}, svg);
  drag(svg, fg, p => { gut.full = clamp((sy + ry - p.y) / (2 * ry), .05, .95); drawGut(); }, 'full');
  txt(svg, sx + rx + 2, level - 10, 'satt', {'text-anchor' : 'middle'});
  gutLayer = el('g', {}, svg); gutWord = txt(svg, 290, 12, '', {'text-anchor' : 'end'});
  gut.way = way;
  // What kind of eater the gut makes, from what it takes most of in its range.
  const mid = Math.sqrt(T * fast), slope = gain(1, mid) - gain(0, mid);
  txt(svg, 4, 12, slope > .1 ? 'Räuber' : slope < -.1 ? 'Pflanzenfresser' : 'Allesfresser', {class : 'head'});

  // ---- Retention: what each food gives over the steps it stays. ----
  const L = 28, R = 236, top = 150, base = 266, X = t => L + (R - L) * clamp(Math.log2(t / K.shortest) / 4, 0, 1), Y = v => base - (base - top) * v;
  const tOf = x => K.shortest * Math.pow(2, 4 * clamp((x - L) / (R - L), 0, 1));
  el('rect', {x : X(fast), y : top - 4, width : Math.max(2, X(T) - X(fast)), height : base - top + 4, fill : '#f1dda6', opacity : .13}, svg);
  el('path', {d : `M${L} ${base} H${R} M${L} ${base} V${top - 6}`, stroke : '#3b6a6c', fill : 'none'}, svg);
  txt(svg, L, top - 12, 'Ertrag');
  for (const t of [50, 100, 200, 400, 800]) { el('path', {d : `M${X(t)} ${base} v4`, stroke : '#3b6a6c'}, svg); txt(svg, X(t), base + 15, t, {'text-anchor' : 'middle'}); }
  txt(svg, R, base + 29, 'Schritte im Darm', {'text-anchor' : 'end'});
  const ends = [];
  for (const [name, a, colour] of FOOD) {
    let good = '', bad = '';
    for (let k = 0; k <= 80; k++) {
      const t = K.shortest * Math.pow(2, 4 * k / 80), pt = `${X(t).toFixed(1)} ${Y(gain(a, t)).toFixed(1)}`;
      if (!hurts(a, t)) good += (good ? ' L' : 'M') + pt;
      else bad += (bad ? ' L' : 'M' + (good ? good.split(' L').at(-1).replace('M', '') + ' L' : '')) + pt;
    }
    el('path', {d : good, fill : 'none', stroke : colour, 'stroke-width' : 2}, svg);
    if (bad) el('path', {d : bad, fill : 'none', stroke : colour, 'stroke-width' : 2, 'stroke-dasharray' : '2 4', opacity : .8}, svg);
    ends.push({name, colour, y : Y(gain(a, K.longest))});
  }
  // Names at the curves' ends, kept apart.
  ends.sort((p, q) => p.y - q.y).forEach((e, i, all) => { if (i && e.y - all[i - 1].y < 12) e.y = all[i - 1].y + 12; txt(svg, R + 6, e.y + 4, e.name, {style : 'fill:' + e.colour}); });
  const pain = FOOD.filter(([, a]) => hurts(a, T)).map(([n]) => n);
  // Grips: the resting gut's time (its length) at the top, the muscle's quickest at the bottom.
  const rg = el('circle', {cx : X(T), cy : top - 4, r : 7}, svg);
  drag(svg, rg, p => { const t = clamp(tOf(p.x), 100, 800); gut.length = Math.log(t / 100) / Math.log(8); drawGut(); }, 'rest');
  txt(svg, X(T) + (X(T) > 200 ? -10 : 10), top - 1, 'in Ruhe', {'text-anchor' : X(T) > 200 ? 'end' : 'start'});
  const mg = el('circle', {cx : X(fast), cy : base - 10, r : 7, style : 'stroke:#eaa886'}, svg);
  drag(svg, mg, p => { gut.speed = clamp(T / tOf(p.x), 1, K.fastest); drawGut(); }, 'muscle');
  txt(svg, X(fast) - 10, base - 6, 'mit Muskel', {'text-anchor' : 'end'});

  // ---- What the fish gets of each food, from the muscle's quickest to the resting gut. ----
  let y = 312;
  txt(svg, 4, y - 8, 'Was der Fisch herausholt', {class : 'head'});
  for (const [name, a, colour] of FOOD) {
    const g1 = gain(a, T), g2 = gain(a, fast), lo = Math.min(g1, g2), hi = Math.max(g1, g2), W = 150, x0 = 66;
    txt(svg, 4, y + 10, name);
    el('rect', {x : x0, y, width : W, height : 12, rx : 3, fill : '#0f2c34', stroke : '#2d5059'}, svg);
    el('rect', {x : x0, y, width : W * lo, height : 12, rx : 3, fill : colour, opacity : .8}, svg);
    el('rect', {x : x0 + W * lo, y, width : Math.max(1.5, W * (hi - lo)), height : 12, fill : colour, opacity : .35}, svg);
    if (hurts(a, T)) el('path', {d : `M${x0 + W * g1} ${y - 2} v16`, stroke : '#ef8f8f', 'stroke-width' : 2, 'stroke-dasharray' : '2 2'}, svg);
    txt(svg, 296, y + 10, Math.round(lo * 100) + (hi - lo > .005 ? '–' + Math.round(hi * 100) : '') + ' %', {'text-anchor' : 'end', class : 'value'});
    y += 20;
  }
  if (pain.length) txt(svg, 4, y + 8, 'Bauchweh in Ruhe: ' + pain.join(', '), {style : 'fill:#ef8f8f'});
  svg.setAttribute('viewBox', `0 0 300 ${y + 14}`);
  gut.T = T; gut.fast = fast;

}
// The food cells over a meal: a bite every 12 steps from step 20 to 140, each as much as the
// fish needs at rest for those steps; the nourishment flows in and ebbs (flow · 0.8 per step).
function drawNutrientSense() {
  const svg = document.getElementById('gutsense'); svg.replaceChildren();
  const L = 8, R = 292, top = 22, base = 112, N = 200, X = s => L + (R - L) * s / N, Y = v => base - (base - top) * v;
  const stimulus = [], report = [];
  let flow = 0, adapted = 0;
  const usable = gain(.5, gut.T);
  for (let s = 0; s <= N; s++) {
    if (s >= 20 && s <= 140 && (s - 20) % 12 === 0) flow += .2 * 12 * usable * 1.6;
    const sig = flow / (flow + 1);
    stimulus.push(sig); report.push(sig > 0 ? sig / (sig + gut.sense + adapted) : 0);
    adapted += (sig - adapted) / gut.tau; flow *= .8;
  }
  const line = vals => 'M' + vals.map((v, s) => `${X(s).toFixed(1)} ${Y(v).toFixed(1)}`).join(' L');
  el('path', {d : line(stimulus) + ` L${X(N)} ${base} L${X(0)} ${base} Z`, fill : '#e3cf94', opacity : .18}, svg);
  el('path', {d : line(report), fill : 'none', stroke : '#79d2be', 'stroke-width' : 2}, svg);
  el('path', {d : `M${L} ${base} H${R}`, stroke : '#3b6a6c'}, svg);
  for (let s = 20; s <= 140; s += 12) el('circle', {cx : X(s), cy : base + 7, r : 2.4, fill : '#e3cf94'}, svg);
  txt(svg, X(20), base + 22, 'frisst'); txt(svg, R, base + 22, N + ' Schritte', {'text-anchor' : 'end'});
  // Grip: how much nourishment the cells take as half (dragged up: they need more).
  el('path', {d : `M${L} ${Y(gut.sense)} H${R}`, stroke : '#f1dda6', 'stroke-dasharray' : '3 4', opacity : .7}, svg);
  const hg = el('circle', {cx : X(170), cy : Y(gut.sense), r : 6.5}, svg);
  drag(svg, hg, p => { gut.sense = clamp((base - p.y) / (base - top), .02, .95); drawNutrientSense(); }, 'sense');
  txt(svg, X(170) + 10, Y(gut.sense) - 6, 'spürt ab');
  // Grip: how soon the cells get used to steady food, at the point they have.
  const used = 20 + gut.tau, ux = X(used), uy = Y(report[Math.round(used)]);
  const ug = el('rect', {x : ux - 6, y : uy - 6, width : 12, height : 12, rx : 2}, svg);
  drag(svg, ug, p => { gut.tau = clamp(Math.round((p.x - L) / (R - L) * N - 20), 4, 48); drawNutrientSense(); }, 'used');
  el('path', {d : `M${ux} ${uy - 7} V${top - 4}`, stroke : '#f1dda6', 'stroke-dasharray' : '2 3', opacity : .6}, svg);
  txt(svg, ux, top - 8, 'gewöhnt sich', {'text-anchor' : 'middle'});
  svg.setAttribute('viewBox', `0 0 300 ${base + 28}`);
}
// The film: a mouthful enters the stomach and moves to the vent in its time; it shrinks as the
// fish takes it up; what reaches the vent leaves as dung. The muscle works every other few seconds.
function gutFrame(now) {
  requestAnimationFrame(gutFrame);
  if (!gutLayer || now - gutLast < 16) return;
  const dt = Math.min(6, (now - gutLast) / 16); gutLast = now;
  const working = gut.speed > 1.02 && Math.floor(now / 3500) % 2 === 1, T = working ? gut.fast : gut.T;
  gutRings.style.opacity = working ? 1 : .35;
  gutWord.textContent = working ? 'Muskel arbeitet' : '';
  gutClock += dt;
  if (gutClock - gutSpawn > 40) { gutSpawn = gutClock; morsels.push({at : 0}); }
  // A step of the gut lasts 0.6 frames: 100 steps take a second.
  for (const m of morsels) m.at += dt / (.6 * T);
  for (const m of morsels.filter(m => m.at >= 1)) dung.push({x : VENT[0] + 2, y : VENT[1] + 4, age : 0});
  morsels = morsels.filter(m => m.at < 1);
  for (const p of dung) { p.age += dt; p.x += .25 * dt; p.y += .35 * dt; }
  dung = dung.filter(p => p.age < 60);
  gutLayer.replaceChildren();
  for (const m of morsels) { const [x, y] = gut.way.at(m.at); el('circle', {cx : x, cy : y, r : 4.5 - 3 * m.at * gain(.5, T), fill : '#e3cf94'}, gutLayer); }
  for (const p of dung) el('ellipse', {cx : p.x, cy : p.y, rx : 3, ry : 2, fill : '#8a7f6a', opacity : clamp(1 - p.age / 60, 0, 1)}, gutLayer);
}
requestAnimationFrame(gutFrame);

// ---------- Schwanz ----------
// How and how strongly the tail beats, set by what it means: how much push the fish has when it
// sets off, and how much is left after it has swum flat out for a while. A cell's fibres run from
// slow to fast (muscle_fibre): fast ones pull 6.25 times as hard in a stroke 12 times as short, but
// tire (0.028·fast² per step of work, refilled by 1/400 of the gap); slow ones never tire. From the
// two pushes the inspector works out the number of cells and the fibre mix. Wriggling (movement.cc,
// environment.hh) loses up to half the push in open water but lowers a buried body's drag from 12
// to 3.
const tail = {cells : 6, fast : .55, wriggle : .3};
const STEPS = 300, MOST_CELLS = 12, MOST_PUSH = 15;
const force = f => .4 * Math.pow(2.5 / .4, f), strokeSteps = f => 4 * Math.pow(12, 1 - f);
function staying(f) {
  let r = 1;
  for (let s = 0; s < STEPS; s++) { const a = 1 - f + f * r; r = clamp(r - .028 * f * f * a + (1 - r) / 400, 0, 1); }
  return 1 - f + f * r;
}
const curve = f => { let r = 1; const out = []; for (let s = 0; s <= STEPS; s++) { const a = 1 - f + f * r; out.push(a); r = clamp(r - .028 * f * f * a + (1 - r) / 400, 0, 1); } return out; };
// The fibre mix for a share of the push that is left after flat out: the share falls as the fibres
// get faster.
function mixFor(share) {
  let best = 0, gap = Infinity;
  for (let k = 0; k <= 200; k++) { const f = k / 200, g = Math.abs(staying(f) - share); if (g < gap) { gap = g; best = f; } }
  return best;
}
let beat = 0, tailSvg = null;
function drawTail() {
  const svg = document.getElementById('tail'); svg.replaceChildren(); tailSvg = svg;
  // The fish, beating its tail: as hard as its push at the start, as quick as its strokes, as
  // wavy as it wriggles (animated in tailFrame).
  el('g', {id : 'tail-fish'}, svg);
  // Grip on the body: pulled away from the middle line, the body wriggles more.
  const wg = el('circle', {cx : 170, cy : 44 + 6 + 30 * tail.wriggle, r : 6.5}, svg);
  drag(svg, wg, p => { tail.wriggle = clamp((p.y - 50) / 30, 0, 1); drawTail(); }, 'wriggle');
  txt(svg, 180, 44 + 10 + 30 * tail.wriggle, tail.wriggle < .2 ? 'steif' : tail.wriggle > .7 ? 'schlängelt stark' : 'schlängelt');
  // Push over time when swimming flat out; in open water, and buried in sand.
  const X0 = 30, W = 256, B = 236, H = 120, X = s => X0 + W * s / STEPS, Y = v => B - H * v / MOST_PUSH;
  const push = tail.cells * force(tail.fast), c = curve(tail.fast);
  const water = 1 - .5 * tail.wriggle, sand = 1 / (12 * Math.pow(3 / 12, tail.wriggle));
  el('path', {d : `M${X0} ${B} H${X0 + W} M${X0} ${B} V${B - H}`, stroke : '#3b6a6c', fill : 'none'}, svg);
  txt(svg, X0 - 4, B - H + 4, 'Schub', {'text-anchor' : 'end', style : 'writing-mode:initial'});
  const line = k => 'M' + c.map((a, s) => `${X(s).toFixed(1)} ${Y(push * a * k).toFixed(1)}`).join(' L');
  el('path', {d : line(water) + ` L${X(STEPS)} ${B} L${X0} ${B} Z`, fill : '#eaa886', opacity : .3, stroke : '#eaa886', 'stroke-width' : 2}, svg);
  el('path', {d : line(sand), fill : 'none', stroke : '#c9b48c', 'stroke-width' : 2, 'stroke-dasharray' : '5 4'}, svg);
  txt(svg, X(STEPS) - 2, Y(push * c[STEPS] * water) - 6, 'im Wasser', {'text-anchor' : 'end', style : 'fill:#eaa886'});
  txt(svg, X(0) + 10, Y(push * sand) - 5, 'im Sand', {style : 'fill:#c9b48c'});
  txt(svg, X0, B + 14, 'Start'); txt(svg, X0 + W, B + 14, STEPS + ' Schritte Vollgas', {'text-anchor' : 'end'});
  // Grips: the push when setting off, and the push still there at the end.
  const g1 = el('circle', {cx : X(0), cy : Y(push * water), r : 7}, svg);
  drag(svg, g1, p => {
    const wanted = clamp((B - p.y) / H, .02, 1) * MOST_PUSH / water;
    tail.cells = clamp(Math.round(wanted / force(tail.fast)), 1, MOST_CELLS); drawTail();
  }, 'start');
  const g2 = el('circle', {cx : X(STEPS), cy : Y(push * c[STEPS] * water), r : 7}, svg);
  drag(svg, g2, p => {
    const left = clamp((B - p.y) / H * MOST_PUSH / water, 0, push);
    tail.fast = mixFor(clamp(left / push, .2, 1)); drawTail();
  }, 'end');
  const kind = tail.fast > .66 ? 'Sprinter' : tail.fast < .33 ? 'Dauerschwimmer' : 'Allrounder';
  txt(svg, X0 + 8, B - H + 4, kind, {class : 'head'});
  // What follows, as information: cells, fibres, beat and upkeep.
  txt(svg, 4, 276, tail.cells + ' Muskelzellen je Seite · ' + Math.round(tail.fast * 100) + ' % schnelle Fasern', {class : 'value'});
  txt(svg, 4, 292, 'ein Schlag dauert ' + Math.round(strokeSteps(tail.fast)) + ' Schritte · Unterhalt ' + (tail.cells * 1.2 * Math.pow(.25, tail.fast)).toFixed(1).replace('.', ','), {class : 'value'});
}
function tailFrame(now) {
  requestAnimationFrame(tailFrame);
  const g = document.getElementById('tail-fish'); if (!g) return;
  const period = strokeSteps(tail.fast) * 2 * 16, phase = (now % period) / period * Math.PI * 2;
  const amp = 3 + 18 * clamp(tail.cells * force(tail.fast) / MOST_PUSH, 0, 1);
  const bend = x => { const t = (x - 40) / 200; return Math.sin(phase - t * (1.5 + 4 * tail.wriggle)) * amp * Math.pow(t, 2 - 1.4 * tail.wriggle); };
  let up = '', down = '';
  for (let x = 40; x <= 220; x += 5) {
    const t = (x - 40) / 180, half = t < .35 ? 6 + 16 * Math.sin(Math.PI / 2 * t / .35) : 4 + 18 * (1 - (t - .35) / .65);
    up += (x === 40 ? 'M' : ' L') + x + ' ' + (44 - half + bend(x)).toFixed(1);
    down = ` L${x} ${(44 + half + bend(x)).toFixed(1)}` + down;
  }
  const tip = 44 + bend(220);
  g.innerHTML = `<path d="${up} L250 ${(tip - 22).toFixed(1)} L240 ${tip.toFixed(1)} L250 ${(tip + 22).toFixed(1)}${down} Z" fill="#1d4048" stroke="#8ac7bb" stroke-width="1.4"/><circle cx="62" cy="${(40 + bend(62)).toFixed(1)}" r="3" fill="#e9e2c6"/>`;
}
requestAnimationFrame(tailFrame);

drawLife(); drawGut(); drawTail();
</script>
