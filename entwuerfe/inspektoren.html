<meta charset="utf-8">
<title>Muster-Inspektoren Atelier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: three inspector panels at their real 320 px width, side by side, as in the atelier. */
:root{color-scheme:dark;--ground:#09212a;--panel:#143039;--edge:#2d5059;--text:#d7e6e3;--soft:#9fbcbc;--axis:#a7c2be;
  --handle:#f1dda6;--handle-core:#153a40;--teal:#79d2be;--motor:#eaa886;--gut:#d9cfae;--cost:#e8a2b5;
  --eggs:#d4b7ee;--fish:#8ac7bb;--track:#0f2c34}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:14px/1.45 system-ui,sans-serif}
main{display:flex;flex-wrap:wrap;gap:24px;padding-block:20px;align-items:flex-start}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{width:320px;max-width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px 10px 14px}
.panel h2{margin:0 0 2px 2px;font:500 12px/1.3 system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.panel h3{margin:0 0 6px 2px;font:400 21px/1.2 Georgia,serif;color:#eef4ec}
svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;overflow:visible}
svg text{fill:var(--axis);font-size:11px}
svg text.value{fill:var(--text);font-variant-numeric:tabular-nums}
.grip{fill:var(--handle-core);stroke:var(--handle);stroke-width:2.2;cursor:grab}
.grip:hover,.grip.dragging{stroke:#fff3c4;stroke-width:3}
.grip.dragging{cursor:grabbing}
.knob{stroke:#0d262c;stroke-width:1.5;cursor:grab}
.knob:hover,.knob.dragging{stroke:#fff;stroke-width:2.5}
.chip{cursor:pointer}
.panel h4{margin:16px 0 4px 0;padding-top:8px;border-top:1px solid var(--edge);font:600 13px/1.3 system-ui;color:#eef4ec;display:flex;align-items:center;gap:7px}
.panel h4.first{border-top:0;padding-top:0;margin-top:6px}
</style>
<main>
  <section class="panel" aria-label="Darm">
    <h2>Organ</h2><h3>Darm</h3>
    <h4 id="gut-kind" class="first">Allesfresser</h4>
    <svg id="fish"></svg>
    <h4>Ertrag</h4>
    <svg id="yield"></svg>
    <svg id="bars"></svg>
    <h4>Sättigungsgefühl</h4>
    <svg id="full"></svg>
    <h4>Bauchweh</h4>
    <svg id="ache"></svg>
    <h4>Geschmack</h4>
    <svg id="feed"></svg>
  </section>
</main>
<script>
'use strict';
// The page has three layers, in this order:
//   settings  S: what the player sets, in the player's terms, nothing derived;
//   model     pure functions of S; M() is their result for the present settings, worked out once
//             per change and read by every picture, so that no number can differ from its curve;
//   pictures  each built once (what never changes) and repainted only where it shows a setting
//             that changed, at most once per frame. What moves by itself (the gut's waves, the
//             stomach's content, the line that runs through the senses) is moved by one clock.

// ===== Helpers =====
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.appendChild(e); return e; };
const txt = (parent, x, y, s, attrs = {}) => { const t = el('text', {x, y, ...attrs}, parent); t.textContent = s; return t; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const path = pts => 'M' + pts.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(' L');
const COLOUR = {axis : '#3b6a6c', track : '#0f2c34', trackEdge : '#2d5059', line : '#f4efd8', handle : '#f1dda6', chosen : '#ffffff', unchosen : '#0d262c',
                sore : '#ef8f8f', stomach : '#c98f55', stomachEdge : '#e6b47c', stomachBack : '#5a4232', tube : '#6b6f5f', muscle : '#9a6a48', morsel : '#e3cf94',
                body : '#16363e', icon : '#e9e2c6', chipEdge : '#5d8384', chipSign : '#d7e6e3', remove : '#e8a2b5', keys : ['#79d2be', '#5fb3a8', '#a6e3d3']};
const keyColour = i => COLOUR.keys[i % COLOUR.keys.length];
// Two kinds of things are dragged, and they look different. A grip ('grip') sets the organ: dark
// with a yellow edge. A knob ('knob') shapes an input the organ receives: a light dot in the
// input's own colour. A thing made anew when its picture is repainted is found again by its name.
let held = null;
function drag(svg, thing, move, name, kind = 'grip') {
  thing.classList.add(kind); thing.setAttribute('data-name', name);
  if (held?.svg === svg && held.name === name) thing.classList.add('dragging');
  thing.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); svg.setPointerCapture(e.pointerId); held = {svg, name}; thing.classList.add('dragging');
    const at = ev => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
    const onMove = ev => move(at(ev));
    const up = () => {
      held = null;
      svg.removeEventListener('pointermove', onMove); svg.removeEventListener('pointerup', up); svg.removeEventListener('pointercancel', up);
      for (const g of svg.querySelectorAll('.dragging')) g.classList.remove('dragging');
    };
    svg.addEventListener('pointermove', onMove); svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  });
}
// A round button; `parts` are the pictures its action changes.
function chip(parent, x, y, sign, act, parts, enabled = true, r = 7) {
  const g = el('g', {class : 'chip', opacity : enabled ? 1 : .3}, parent), d = r * .45, red = sign === '×';
  el('circle', {cx : x, cy : y, r, style : `fill:${COLOUR.track};stroke:${red ? COLOUR.remove : COLOUR.chipEdge};stroke-width:1.4`}, g);
  el('path', {d : red ? `M${x - d * .8} ${y - d * .8} l${1.6 * d} ${1.6 * d} m0 ${-1.6 * d} l${-1.6 * d} ${1.6 * d}` : `M${x - d} ${y} h${2 * d}` + (sign === '+' ? ` M${x} ${y - d} v${2 * d}` : ''), stroke : red ? COLOUR.remove : COLOUR.chipSign, 'stroke-width' : 1.5, 'stroke-linecap' : 'round'}, g);
  if (enabled) g.addEventListener('click', e => { e.stopPropagation(); act(); draw(parts); });
}
function fishIcon(parent, x, cy, s) {
  const w = 14 * s, t = 6 * s;
  el('path', {d : `M${x - w} ${cy} Q${x} ${cy - t * 1.6} ${x + w} ${cy} Q${x} ${cy + t * 1.6} ${x - w} ${cy} Z M${x + w} ${cy} l${5 * s} ${-4 * s} v${8 * s} Z`, fill : 'none', stroke : COLOUR.icon, 'stroke-width' : 1.4}, parent);
}

// ===== Settings =====
// length: the gut's length (0.5 to 4). muscle: the gut muscle's strength (0 none, 1 all it can
// be). from, until: the share of the life after hatching in which the muscle works. Each sense:
// its keys (a threshold and how far its cells spread around it; `used` how fast they tire) and the
// input tried on it.
const S = {
  length : 4, muscle : .9, from : 0, until : .5,
  full : {keys : [{gate : .6, spread : .1}], chosen : 0, input : {rise : 120, height : .8, stop : 520}},
  ache : {keys : [{gate : .3, spread : .1, used : 200}], chosen : 0, input : {rise : 60, height : .7, stop : 600}},
  feed : {keys : [{gate : .25, spread : .1, used : 200}], chosen : 0, input : {rise : 40, height : .6, stop : 300}}
};

// ===== The model: the one source for every picture and number =====
// Engine: the gut's length is set once at birth; at rest a meal stays REST_PER_LENGTH steps per
// unit of length and moves on by itself. The muscle, when the brain drives it, moves the content
// up to FASTEST times as fast, the more the bigger the body; within each twitch the stay swings
// between rest and twice the mean pace (src/physiology.hh:361-370, src/body_plan.cc:1469-1479).
const SHORTEST = .5, LONGEST = 4, REST_PER_LENGTH = 200, FASTEST = 4;
// The stays the pictures show.
const SHORT = 50, LONG = 800;
// The muscle's pace at full drive, as the engine has it (gut_speed, src/physiology.hh:363-366):
// 1 + (FASTEST - 1) x strength squared. The strength is min(1, 2 x force / (force + the body's
// scale of forces)) (suction_share, src/physiology.hh:305-307), and the force grows with the
// body. `muscle` is that strength in the grown body; in a body of the size `scale` (grown: 1) the
// same muscle has the strength 2 x scale x muscle / (2 - muscle + scale x muscle).
const strengthAt = (muscle, scale) => Math.min(1, 2 * scale * muscle / (2 - muscle + scale * muscle));
const paceOf = strength => 1 + (FASTEST - 1) * strength * strength;
const strengthFor = pace => Math.sqrt(clamp((pace - 1) / (FASTEST - 1), 0, 1));
// The body's size over the life after hatching: the hatchling's against the grown fish's (the
// reference size Claude read from the engine, KOORDINATION 13.11.).
const HATCH_SCALE = .74;
const scaleAt = s => HATCH_SCALE + (1 - HATCH_SCALE) * s;
const WORKING_LIFE_MIN = .15;
const LIFE = Array.from({length : 41}, (_, k) => k / 40);

// Foods by their stuffs. Each stuff: steps to break half of it open (0: open at once), steps to
// take it up, steps after which it spoils as fast as it is taken up (0: never), and the share that
// can be taken up at best. The values meet David's numbers (FEEDBACK-1311, line 12): leaf at best
// 92 %, meat 82 %, plankton 72 %, algae 78 % and held from about 630 steps to the long end; at the
// left edge (50 steps) algae 18 % and plankton 34 %.
//
// PROPOSAL TO THE ENGINE: this is not what the engine computes today.
//   stuff   here                        engine today (src/protocol_schema.hh:2024-2037)
//   flesh   opens 0, up 20, spoils 250  the same
//   pulp    0, 33, 800                  0, 8, 720
//   shell   100, 4, 480, at best 86 %   80, 20, 330
//   hard    430, 2, never               fibre 400, 20, never
//   soft    230, 4, never, 78 %         none: algae are 82 % of the one fibre
//   sap     0, 20, never                none: algae's quick part is the pulp of flocks
//   foods   leaf hard 1; algae sap .25, soft .70; flocks pulp .77; plankton flesh .445, shell .52
//           engine (src/physiology.hh:183-200): leaf fibre 1; algae pulp .18, fibre .82; flocks
//           pulp .62, fibre .10; plankton flesh .5, shell .5
//   The formula is the engine's (stuff_yield, src/physiology.hh:229-234) with one addition: the
//   share taken up at best. With it the engine can give these curves; it needs two more stuffs.
//   Algae hold their 78 % to the long end only because their quick part (sap) never spoils.
const STUFFS = {flesh : [0, 20, 250, 1], shell : [100, 4, 480, .86], pulp : [0, 33, 800, 1], sap : [0, 20, 0, 1], soft : [230, 4, 0, .78], hard : [430, 2, 0, 1]};
const FOOD = [['Blatt', {hard : 1}, '#8fd16a'], ['Alge', {sap : .25, soft : .7}, '#55c4a6'], ['Flocken', {pulp : .77}, '#e3cf94'], ['Plankton', {flesh : .445, shell : .52}, '#9cc8f0'], ['Fleisch', {flesh : 1}, '#ef8f8f']];
const KIND = {Blatt : 'Pflanzenfresser', Alge : 'Algenfresser', Flocken : 'Allesfresser', Plankton : 'Planktonfresser', Fleisch : 'Räuber'};
function stuffYield(t, [opens, uptake, spoils, best]) {
  const k = 1 / uptake, r = opens > 0 ? Math.min(1, Math.pow(t / opens, 4) / t) : Infinity, open = opens > 0 ? r / (r + 1 / t) : 1;
  const spoil = spoils > 0 ? Math.min(1, Math.pow(t / spoils, 4) / uptake) : 0;
  return best * open * k / (k + spoil + 1 / t);
}
const gain = (f, t) => Object.entries(f).reduce((a, [s, share]) => a + share * stuffYield(t, STUFFS[s]), 0);
// Bellyache of a full gut of a food at a stay, by the engine's rule (gut_ache,
// src/physiology.hh): flesh hurts when its stay x its share passes ACHE_FLESH_STAY; a meal that
// is fibre by more than ACHE_FIBRE hurts when it stays shorter than ACHE_FIBRE_STAY x that
// excess; past these limits by the share CRAMP it hurts all it can.
// PROPOSAL TO THE ENGINE: two of its values are changed here. With the new stuffs the engine's
// own values (375 and .55) let plankton never hurt and algae only below 60 steps; before the
// stuffs changed, plankton hurt from 750 steps and algae below 108. These two values bring that
// back (leaf then hurts below 228 steps instead of 180, meat from 334 instead of 375).
const ACHE_FLESH_STAY = 334, ACHE_FIBRE = .43, ACHE_FIBRE_STAY = 400, CRAMP = .25;
function ache(f, t) {
  const flesh = f.flesh ?? 0, fibre = (f.hard ?? 0) + (f.soft ?? 0);
  const spoiling = flesh > 0 ? t * flesh / ACHE_FLESH_STAY - 1 : 0, closed = fibre > ACHE_FIBRE ? 1 - t / (ACHE_FIBRE_STAY * (fibre - ACHE_FIBRE)) : 0;
  return clamp(Math.max(spoiling, closed) / CRAMP, 0, 1);
}
const HURTS = 0;
// What does not depend on the settings: every food's yield and ache along the pictures' axis.
const AXIS = Array.from({length : 141}, (_, k) => SHORT * Math.pow(LONG / SHORT, k / 140));
const CURVES = FOOD.map(([name, f, colour]) => {
  const gains = AXIS.map(t => gain(f, t));
  return {name, f, colour, gains, aches : AXIS.map(t => ache(f, t)), best : Math.max(...gains)};
});
// What a food gives within a span of stays, where a full gut of it hurts there, and how much.
function rangeIn(c, [lo, hi]) {
  const gains = [gain(c.f, lo), gain(c.f, hi)], aches = [ache(c.f, lo), ache(c.f, hi)];
  AXIS.forEach((t, k) => { if (t > lo && t < hi) { gains.push(c.gains[k]); aches.push(c.aches[k]); } });
  const sore = gains.filter((_, k) => aches[k] > HURTS);
  return {min : Math.min(...gains), max : Math.max(...gains), sore : sore.length ? [Math.min(...sore), Math.max(...sore)] : null,
          ache : [Math.min(...aches), Math.max(...aches)]};
}
// Everything the pictures read, for the present settings.
function derive() {
  const rest = REST_PER_LENGTH * S.length, pace = paceOf(S.muscle);
  const works = s => s >= S.from && s <= S.until;
  // The fastest the gut gets at an age: at the muscle's full drive there. Over a meal the drive
  // counts, not the swing within a twitch (twice the wall's pose averages its drive,
  // src/body_plan.cc:1470-1479).
  const paceAt = s => works(s) ? paceOf(strengthAt(S.muscle, scaleAt(s))) : 1;
  const windowAt = s => [rest / paceAt(s), rest];
  // Every stay this fish's gut ever has: from the fastest of its life to rest.
  const reach = [Math.min(...LIFE.map(s => rest / paceAt(s))), rest];
  const ranges = CURVES.map(c => rangeIn(c, reach));
  const top = ranges.reduce((b, r, i) => r.max > ranges[b].max ? i : b, 0);
  return {rest, pace, works, windowAt, reach, ranges, kind : KIND[CURVES[top].name]};
}
let model = null;
const M = () => model ??= derive();
// The muscle strength that makes `stay` the fastest at an age (strengthAt, turned round).
function muscleForFastest(stay, age) {
  const scale = scaleAt(age), strength = strengthFor(REST_PER_LENGTH * S.length / stay);
  return clamp(2 * strength / (2 * scale + strength - scale * strength), 0, 1);
}
// The age the yield is shown at: a trial, not a setting of the organ.
const shown = {age : .2};

// ===== The senses' model =====
// Each sense has keys; a key's cells have thresholds spread around it. An input over STEPS steps
// rises to a height, holds and stops. A cell answers what lies above its threshold; cells that
// tire (bellyache, nutrients) get used to the input at the pace `used`, cells of fullness do not
// (the engine: adapting_sense, src/brain_interface.hh:19-21).
const STEPS = 900, CELLS = 7, USED = [4, 1024];
const SENSE = {
  full : {title : 'Signalverlauf bei Magenfüllung', colour : COLOUR.stomachEdge, tires : false, after : 260, shows : ['fish', 'full'], row : null},
  ache : {title : 'Signalverlauf bei Bauchweh', used : 'an Schmerz gewöhnt', colour : COLOUR.sore, tires : true, after : 120, shows : ['ache'], row : {word : 'Bauchweh bei vollem Darm durch', of : r => r.ache}},
  // The taste of what is swallowed: at each swallow the engine adds what the bite is worth to
  // this gut, and it fades within a few steps (take_nutrition, src/physiology.cc:205-222,
  // nutrient_keep .8 per step).
  feed : {title : 'Signalverlauf beim Fressen', used : 'an Geschmack gewöhnt', colour : COLOUR.morsel, tires : true, after : 5, shows : ['feed'], row : {word : 'Geschmack eines Bissens von', of : r => [r.min, r.max]}}
};
const cellGates = k => Array.from({length : CELLS}, (_, c) => clamp(k.gate + k.spread * ((c + .5) / CELLS - .5), .02, .98));
const answer = (x, gate, used) => { const over = (clamp(x, 0, 1) - used - gate) / (1 - gate); return over > 0 ? over / (over + gate * (1 - over)) : 0; };
function stimulus(id) {
  const i = S[id].input, top = i.height * clamp(i.stop / Math.max(1, i.rise), 0, 1), after = SENSE[id].after;
  return Array.from({length : STEPS + 1}, (_, st) => st <= i.stop ? i.height * clamp(st / Math.max(1, i.rise), 0, 1) : top * Math.exp(-(st - i.stop) / after));
}
// What a key's cells send under an input, step by step, and what they have got used to by then.
function run(id, k, stim) {
  const gates = cellGates(k), pace = SENSE[id].tires ? 1 / k.used : 0, sent = [], used = []; let u = 0;
  for (const s of stim) { sent.push(gates.reduce((t, g) => t + answer(s, g, u), 0) / CELLS); used.push(u); u += (s - u) * pace; }
  return {sent, used};
}
// The step at which a key's last cell falls silent under this input: what it is used to has
// risen to within its threshold of the input. Past the picture's steps if it never does.
function silentStep(k, stim) {
  const last = Math.min(...cellGates(k)); let used = 0, heard = false;
  for (let st = 0; st <= STEPS; st++) {
    const hears = stim[st] - used > last;
    if (heard && !hears) return st;
    heard ||= hears; used += (stim[st] - used) / k.used;
  }
  return STEPS + 1;
}
// The pace of tiring that puts that step where it is wanted (the slower, the later).
function usedFor(k, stim, step) {
  let [lo, hi] = USED;
  for (let n = 0; n < 24; n++) { const mid = (lo + hi) / 2; if (silentStep({...k, used : mid}, stim) < step) lo = mid; else hi = mid; }
  return hi;
}

// ===== Pictures: built once, repainted where the settings changed =====
// A picture has what never changes (built once) between a layer below it and one above it; only
// those two layers are repainted. Its height is fixed, so nothing below it moves.
const pictures = {};
function picture(id, height, build) {
  let p = pictures[id];
  if (!p) {
    const svg = document.getElementById(id);
    svg.setAttribute('viewBox', `0 0 300 ${height}`);
    const under = el('g', {}, svg), fixed = el('g', {}, svg), live = el('g', {}, svg);
    p = pictures[id] = {svg, under, live};
    build?.(fixed, svg);
  }
  p.under.replaceChildren(); p.live.replaceChildren();
  return p;
}
const EVERY = ['fish', 'yield', 'bars', 'full', 'ache', 'feed'], SHOW_GUT = ['fish', 'yield', 'bars', 'ache', 'feed'];
const dirty = new Set();
let queued = 0;
// A setting has changed: its pictures are repainted in the next frame, however often this is
// called before.
function draw(parts = EVERY) {
  model = null;
  for (const part of parts) dirty.add(part);
  queued ||= requestAnimationFrame(repaint);
}
function repaint() {
  queued = 0;
  document.getElementById('gut-kind').textContent = M().kind;
  for (const part of dirty) PAINT[part]();
  dirty.clear();
  showMoment();
}

// ===== What moves: one clock =====
// The clock runs through the senses' STEPS again and again. With it run the line through each
// sense's picture, the stomachs' content (the fullness input at that moment), the pulses of the
// nerve cells (as fast as their signal is strong), the three signals beside the fish, and the gut:
// always its own calm waves, and in the second half of each round the muscle's, stronger and
// faster as the muscle is. As many morsels enter the gut as the stomach is full.
const ROUND_MS = 12000;
const play = {step : 0, wave : 0, last : 0, seen : true, stim : {}, sent : {}, lines : {}, glow : [], levels : [], nerves : {}, meters : {}};
const muscleWorks = () => play.step > STEPS / 2 && S.muscle > 0;

// ===== The fish: stomach, gut and its muscle =====
// The stomach, large, with the gullet from the mouth. Across it lies a band for each satiety key
// (how far its cells' thresholds spread); its content rises and falls with the fullness input.
// The gut fills the body behind the stomach in loops that follow the body's outline: the longer
// it is, the more loops and the further back. Its wall is the muscle, as thick as it is strong.
// Beside the fish: what its three senses send to the brain at this moment.
const NOSE = [14, 64], BACK = [110, 10], RUMP = [236, 48], MIDLINE = 64;
const BODY = `M${NOSE} Q30 14 ${BACK} Q200 10 ${RUMP} L284 18 Q276 64 284 110 L236 80 Q200 118 110 118 Q30 114 ${NOSE} Z`;
function onCurve([x0, y0], [x1, y1], [x2, y2], x) {
  let lo = 0, hi = 1, t = .5;
  for (let n = 0; n < 20; n++) { t = (lo + hi) / 2; if ((1 - t) * (1 - t) * x0 + 2 * t * (1 - t) * x1 + t * t * x2 < x) lo = t; else hi = t; }
  return (1 - t) * (1 - t) * y0 + 2 * t * (1 - t) * y1 + t * t * y2;
}
// The body's upper outline at x; the lower one mirrors it.
const bodyTop = x => x < BACK[0] ? onCurve(NOSE, [30, 14], BACK, x) : onCurve(BACK, [200, 10], RUMP, x);
const FISH = {down : 18, height : 172, meters : 152}, STOMACH = {x : 78, y : 60, rx : 31, ry : 30};
const GUT = {left : 124, right : [150, 212], margin : 20, bulge : 7, folds : [2, 5]}, WALL = [1, 5], TUBE = 6, WALL_GRIP = 12;
const lengthShare = () => (S.length - SHORTEST) / (LONGEST - SHORTEST);
function stomachPath({x, y, rx : w, ry : h}) {
  return `M${x - .55 * w} ${y - h} C${x - 1.05 * w} ${y - .6 * h} ${x - 1.1 * w} ${y + .55 * h} ${x - .35 * w} ${y + h}`
       + ` C${x + .35 * w} ${y + 1.12 * h} ${x + 1.05 * w} ${y + .55 * h} ${x + w} ${y - .05 * h}`
       + ` C${x + .95 * w} ${y - .55 * h} ${x + .45 * w} ${y - .55 * h} ${x + .2 * w} ${y - .75 * h}`
       + ` C${x + .05 * w} ${y - .9 * h} ${x - .2 * w} ${y - 1.05 * h} ${x - .55 * w} ${y - h} Z`;
}
// A stomach whose content the clock moves; `bands` is where the satiety keys' bands are drawn.
function stomach(parent, at, name, owner) {
  el('clipPath', {id : name}, parent).appendChild(el('path', {d : stomachPath(at)}));
  el('path', {d : stomachPath(at), fill : COLOUR.stomachBack}, parent);

    const y = IY(k.gate), chosen = i === cell.chosen;
    const line = el('path', {d : `M${LX + 12} ${y} H${R}`, stroke : keyColour(i), 'stroke-dasharray' : '4 3', 'stroke-width' : chosen ? 1.8 : 1.1}, live);
    play.glow.push({owner : id, line, gate : k.gate, sense : id});
    if (chosen && o.tires) el('path', {d : path(runs[i].used.map((u, st) => [X(st), IY(Math.min(...cellGates(k)) + u)])), fill : 'none', stroke : keyColour(i), 'stroke-width' : 1.4}, live);
  });
  // The signal on its own baseline, under the input.
  const AY = v => A1 - (A1 - I1 - 14) * v / keys.length;
  let below = Array(STEPS + 1).fill(0);
  keys.map((k, i) => i).sort((a, b) => keys[a].gate - keys[b].gate).forEach(i => {
    const over = below.map((u, st) => u + runs[i].sent[st]);
    const band = el('path', {d : `${path(over.map((v, st) => [X(st), AY(v)]))} L${back(below.map((v, st) => [X(st), AY(v)]))} Z`, fill : keyColour(i), opacity : i === cell.chosen ? .85 : .55, class : 'chip'}, live);
    band.addEventListener('pointerdown', choose(i));
    below = over;
  });
  play.sent[id] = below.map(v => v / keys.length);
  el('path', {d : `M${L} ${I0 - 2} V${A1} H${R} M${L} ${I1} H${R}`, stroke : COLOUR.axis, fill : 'none'}, live);
  nerve(live, id, LX + 8, (I1 + A1) / 2 + 2, keyColour(cell.chosen));
  txt(live, L, A1 + 14, 'Schritte');
  for (const st of [300, 600]) txt(live, X(st), A1 + 14, st, {'text-anchor' : 'middle'});
  txt(live, R, A1 + 14, STEPS, {'text-anchor' : 'end'});
  // The clock's line through both parts.
  play.lines[id] = {line : el('path', {stroke : COLOUR.line, 'stroke-width' : 1.2, opacity : .8}, live), x : X, top : I0, base : A1};
  // Where the chosen key's cells have got used to the input.
  if (o.tires) {
    const k = keys[cell.chosen], at = silentStep(k, stim), x = X(Math.min(STEPS, at)), left = x > (L + R) / 2;
    el('path', {d : `M${x} ${I0} V${A1}`, stroke : keyColour(cell.chosen), 'stroke-dasharray' : '2 3'}, live);
    if (at <= STEPS) txt(live, x + (left ? -6 : 6), I1 + 11, o.used, {'text-anchor' : left ? 'end' : 'start', style : 'font-size:10px'});
    drag(svg, el('rect', {x : x - 5, y : A1 - 14, width : 10, height : 14, rx : 3, style : 'stroke:' + keyColour(cell.chosen)}, live), p => { k.used = usedFor(k, stim, stOf(p.x)); draw([id]); }, id + 'used');
  }
  // The grips, above everything they could be hidden by: the keys, the chosen key's spread, the
  // input's knobs (when it is fully there and how strong, and when it stops).
  keys.forEach((k, i) => {
    const chosen = i === cell.chosen;
    drag(svg, el('rect', {x : LX - 9, y : IY(k.gate) - 4, width : 18, height : 8, rx : 2, style : `fill:${keyColour(i)};stroke:${chosen ? COLOUR.chosen : COLOUR.unchosen};stroke-width:${chosen ? 2 : 1}`}, live),
      p => { k.gate = clamp(vOf(p.y), .03, .97); cell.chosen = i; draw(o.shows); }, id + 'key' + i);
  });
  const k = keys[cell.chosen];
  keyGrip(svg, live, R - 8, IY(Math.max(...cellGates(k))), p => { k.spread = clamp(2 * (vOf(p.y) - k.gate), 0, .8); draw(o.shows); }, id + 'spread');
  drag(svg, el('circle', {cx : X(inp.rise), cy : IY(inp.height), r : 5.5, fill : o.colour}, live), p => { inp.rise = clamp(stOf(p.x), 1, inp.stop - 1); inp.height = vOf(p.y); draw(o.shows); }, id + 'rise', 'knob');
  drag(svg, el('circle', {cx : X(inp.stop), cy : IY(inp.height), r : 5.5, fill : o.colour}, live), p => { inp.stop = clamp(stOf(p.x), inp.rise + 1, STEPS - 10); inp.height = vOf(p.y); draw(o.shows); }, id + 'stop', 'knob');
  chip(live, LX - 30, A1 + 10, '−', () => { keys.splice(cell.chosen, 1); cell.chosen = 0; }, o.shows, keys.length > 1, 6);
  chip(live, LX - 14, A1 + 10, '+', () => { keys.push({gate : clamp((Math.max(...keys.map(k => k.gate)) + 1) / 2, .05, .95), spread : .1, ...(o.tires ? {used : 200} : {})}); cell.chosen = keys.length - 1; }, o.shows, keys.length < 3, 6);
  // What each food gives these cells in this gut, with the keys' thresholds across.
  if (o.row) {
    const B0 = A1 + 44, B1 = B0 + row, width = FOOD.length * (rowBar + rowGap) - rowGap, left = R - width, ranges = M().ranges;
    const BY = v => B1 - (B1 - B0) * clamp(v, 0, 1);
    txt(live, R, B0 - 6, o.row.word, {'text-anchor' : 'end'});
    CURVES.forEach((c, j) => {
      const [lo, hi] = o.row.of(ranges[j]), x = left + (rowBar + rowGap) * j;
      el('rect', {x, y : B0, width : rowBar, height : B1 - B0, rx : 2, fill : COLOUR.track, stroke : COLOUR.trackEdge}, live);
      el('rect', {x, y : BY(hi), width : rowBar, height : B1 - BY(hi), rx : 2, fill : c.colour, opacity : .4}, live);
      el('rect', {x, y : BY(lo), width : rowBar, height : B1 - BY(lo), rx : 2, fill : c.colour, opacity : .9}, live);
      txt(live, x + rowBar / 2, B1 + 11, c.name, {'text-anchor' : 'middle', style : `fill:${c.colour};font-size:9px`});
    });
    keys.forEach((k, i) => el('path', {d : `M${left - 3} ${BY(k.gate)} H${R}`, stroke : keyColour(i), 'stroke-dasharray' : '4 3', 'stroke-width' : i === cell.chosen ? 1.6 : 1}, live));
  }
}

// ===== The clock =====
// Shows the present moment: the lines, what the holders hold, the keys the input has passed, what
// the senses send.
function showMoment() {
  const st = Math.round(play.step), now = id => play.stim[id]?.[st] ?? 0;
  for (const {line, x, top, base} of Object.values(play.lines)) line.setAttribute('d', `M${x(st).toFixed(1)} ${top} V${base}`);
  for (const l of play.levels) l.show(now(l.sense));
  for (const g of play.glow) g.line.setAttribute('opacity', now(g.sense) >= g.gate ? 1 : .45);
  for (const [id, bar] of Object.entries(play.meters)) bar.setAttribute('width', (METER_WIDTH * (play.sent[id]?.[st] ?? 0)).toFixed(1));
}
// The gut's waves: its own, calm, always; the muscle's on top while it works. A piece's width is
// written only when it has changed. A morsel leaves the stomach only if the stomach holds enough.
function showGut(dt) {
  const works = muscleWorks(), depth = works ? .25 + .75 * S.muscle : .12, pace = works ? M().pace : 1;
  play.wave += dt * .00009 * pace;
  const wall = TUBE + 2 * (WALL[0] + (WALL[1] - WALL[0]) * S.muscle), fill = play.stim.full?.[Math.round(play.step)] ?? 0;
  for (let k = 0; k < SEGMENTS; k++) {
    const seg = film.segs[k], squeeze = Math.pow(.5 + .5 * Math.cos(2 * Math.PI * ((k + .5) / SEGMENTS - play.wave) * WAVES), 6) * depth;
    const outer = (wall + 3 * squeeze).toFixed(1), inner = (TUBE - 4 * squeeze).toFixed(1);
    if (outer !== seg.wallWidth) { seg.wall.setAttribute('stroke-width', outer); seg.wallWidth = outer; }
    if (inner !== seg.tubeWidth) { seg.tube.setAttribute('stroke-width', inner); seg.tubeWidth = inner; }
  }
  for (const b of film.bits) {
    const u = b.u + dt * .00009 * pace / Math.max(.5, S.length);
    if (u >= 1) { b.on = b.share <= fill; b.e.setAttribute('opacity', b.on ? 1 : 0); }
    b.u = u % 1;
    if (!b.on) continue;
    const [x, y] = film.way.at(b.u); b.e.setAttribute('cx', x.toFixed(1)); b.e.setAttribute('cy', y.toFixed(1));
  }
}
// The nerve cells' pulses run down their fibre as fast as the signal is strong.
function showNerves(dt) {
  const st = Math.round(play.step);
  for (const [id, n] of Object.entries(play.nerves)) {
    const sent = play.sent[id]?.[st] ?? 0;
    n.phase = (n.phase + dt * .0025 * sent) % 1;
    n.pulses.forEach((p, i) => { const [x, y] = n.way((n.phase + i / 3) % 1); p.setAttribute('cx', x.toFixed(1)); p.setAttribute('cy', y.toFixed(1)); p.setAttribute('opacity', sent > .02 ? 1 : 0); });
  }
}
function tick(now) {
  requestAnimationFrame(tick);
  if (!play.seen || !film.way) { play.last = 0; return; }
  const dt = play.last ? Math.min(50, now - play.last) : 16; play.last = now;
  play.step = (play.step + dt * STEPS / ROUND_MS) % STEPS;
  showMoment(); showGut(dt); showNerves(dt);
}

// ===== Everything from the model =====
const PAINT = {fish : drawFish, yield : drawYield, bars : drawBars, full : () => drawSense('full'), ache : () => drawSense('ache'), feed : () => drawSense('feed')};
// The senses first: the fish's stomach follows the fullness input.
for (const part of ['full', 'ache', 'feed', 'fish', 'yield', 'bars']) dirty.add(part);
repaint();
showGut(0);
// Nothing moves while the panel is off the screen, or for someone who has asked for less motion:
// then the moment shown is the input at its height.
if (typeof IntersectionObserver === 'function') new IntersectionObserver(seen => { play.seen = seen.at(-1).isIntersecting; }).observe(document.querySelector('.panel'));
if (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches) { play.step = S.full.input.rise; showMoment(); }
else requestAnimationFrame(tick);
</script>
