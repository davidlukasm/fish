<title>Muster-Inspektoren Atelier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: three inspector panels at their real 320 px width, side by side, as in the atelier. */
:root{color-scheme:dark;--ground:#09212a;--panel:#143039;--edge:#2d5059;--text:#d7e6e3;--soft:#9fbcbc;--axis:#a7c2be;
  --handle:#f1dda6;--handle-core:#153a40;--teal:#79d2be;--motor:#eaa886;--gut:#d9cfae;--cost:#e8a2b5;
  --eggs:#d4b7ee;--fish:#8ac7bb;--track:#0f2c34}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:14px/1.45 system-ui,sans-serif}
main{display:flex;flex-wrap:wrap;gap:24px;padding-block:20px;align-items:flex-start}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{width:320px;max-width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px 10px 14px}
.panel h2{margin:0 0 2px 2px;font:500 12px/1.3 system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.panel h3{margin:0 0 6px 2px;font:400 21px/1.2 Georgia,serif;color:#eef4ec}
svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;overflow:visible}
svg text{fill:var(--axis);font-size:11px}
svg text.head{fill:var(--text);font-size:12px;font-weight:500}
svg text.value{fill:var(--text);font-variant-numeric:tabular-nums}
.grip{fill:var(--handle-core);stroke:var(--handle);stroke-width:2.2;cursor:grab}
.grip:hover,.grip.dragging{stroke:#fff3c4;stroke-width:3}
.grip.dragging{cursor:grabbing}
.chip{cursor:pointer}
.chip rect{fill:var(--track);stroke:var(--edge)}
.chip:hover rect{stroke:var(--handle)}
.note{color:var(--soft);font-size:12px;max-width:1010px;padding-block:0 24px;margin:0}
.note b{color:var(--text);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes squeeze{0%,100%{r:4.6;stroke-width:1.4}40%{r:2.6;stroke-width:3.2}}
</style>
<main>
  <section class="panel" aria-label="Lebenslauf">
    <h2>Zelle</h2><h3>Lebenslauf</h3>
    <svg id="life" viewBox="0 0 300 200"></svg>
  </section>
  <section class="panel" aria-label="Darm">
    <h2>Organ</h2><h3>Darm</h3>
    <svg id="gut" viewBox="0 0 300 266"></svg>
  </section>
  <section class="panel" aria-label="Schwanz">
    <h2>Organ</h2><h3>Schwanz</h3>
    <svg id="tail" viewBox="0 0 300 356"></svg>
  </section>
</main>
<p class="note"><b>Entwurf zum Anklicken.</b> Gezogen wird an den gelben Griffen. Im Lebenslauf schalten die drei Knöpfe unten, ob Bau, Arbeit und Tod an der Reife hängen oder an einem Botenstoff. Alle Zahlen folgen den Formeln der Engine, siehe LEITLINIE.md.</p>
<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const txt = (parent, x, y, s, attrs = {}) => { const t = el('text', {x, y, ...attrs}, parent); t.textContent = s; return t; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pct = x => Math.round(x * 100) + ' %';
function drag(svg, grip, move) {
  grip.classList.add('grip');
  grip.addEventListener('pointerdown', e => {
    e.preventDefault(); grip.setPointerCapture(e.pointerId); grip.classList.add('dragging');
    const at = ev => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
    const onMove = ev => move(at(ev));
    const up = () => { grip.classList.remove('dragging'); grip.removeEventListener('pointermove', onMove); grip.removeEventListener('pointerup', up); };
    grip.addEventListener('pointermove', onMove); grip.addEventListener('pointerup', up);
  });
}
// A bar of a share, with its value at the right.
function bar(svg, x, y, w, share, colour, value, name) {
  if (name) txt(svg, 4, y + 10, name);
  el('rect', {x, y, width : w, height : 12, rx : 3, fill : '#0f2c34', stroke : '#2d5059'}, svg);
  el('rect', {x, y, width : w * clamp(share, 0, 1), height : 12, rx : 3, fill : colour, opacity : .75}, svg);
  txt(svg, 296, y + 10, value, {'text-anchor' : 'end', class : 'value'});
}
const TRIGGERS = [['Reife', '#f1dda6'], ['Stoff A', '#e8a2b5'], ['Stoff B', '#d4b7ee'], ['Stoff C', '#9cc8f0'], ['Stoff D', '#8fdcc0'], ['Stoff E', '#f0c58a'], ['Stoff F', '#c9e58f']];

// ---------- Lebenslauf ----------
// One strip over the fish's maturity (physiology.hh: tissue ÷ adult tissue): before it is built
// the cell is an outline; from its build on it is filled as high as it works (½·(1 + answer):
// switched off at the bottom, full at the top); where it dies it ends with a cross. Each of the
// three answers switches once from a start to an end value (hormones.hh), here at a maturity.
const life = {hatch : .28, build : .12, from : .9, to : .35, at : .7, death : 1.1, trigger : {build : 0, work : 0, death : 0}};
function drawLife() {
  const svg = document.getElementById('life'); svg.replaceChildren();
  const L = 10, R = 290, X = m => L + (R - L) * clamp(m, 0, 1), top = 78, base = 132;
  const Y = v => base - (base - top) * v;
  // The life: egg, hatching, a fish growing to its adult size.
  el('rect', {x : L, y : 8, width : X(life.hatch) - L, height : 40, rx : 6, fill : '#1a3c44'}, svg);
  el('ellipse', {cx : (L + X(life.hatch)) / 2, cy : 24, rx : 7, ry : 9, fill : 'none', stroke : '#e9e2c6', 'stroke-width' : 1.5}, svg);
  txt(svg, (L + X(life.hatch)) / 2, 44, 'Ei', {'text-anchor' : 'middle'});
  for (const [m, s] of [[.42, .55], [.66, .8], [.92, 1.1]]) {
    const x = X(m), w = 14 * s, h = 6 * s;
    el('path', {d : `M${x - w} 24 Q${x} ${24 - h * 1.6} ${x + w} 24 Q${x} ${24 + h * 1.6} ${x - w} 24 Z M${x - w} 24 l${-5 * s} ${-4 * s} v${8 * s} Z`, fill : 'none', stroke : '#e9e2c6', 'stroke-width' : 1.3}, svg);
  }
  el('path', {d : `M${X(life.hatch)} 6 V52`, stroke : '#e9e2c6', 'stroke-dasharray' : '3 3'}, svg);
  txt(svg, X(life.hatch) + 4, 44, 'Schlupf'); txt(svg, R, 44, 'erwachsen', {'text-anchor' : 'end'});
  const t = life.trigger;
  // Where each part happens along the life; a part tied to a messenger shows at its place anyway,
  // marked with that messenger's colour, because when it happens depends on the messenger.
  const built = life.build, dies = life.death, working = m => life.from + (life.to - life.from) / (1 + Math.exp(-(m - life.at) * 22));
  el('path', {d : `M${L} ${base} H${R}`, stroke : '#3b6a6c'}, svg);
  el('path', {d : `M${L} ${top} H${R}`, stroke : '#3b6a6c', 'stroke-dasharray' : '2 4'}, svg);
  el('rect', {x : L, y : top, width : X(built) - L, height : base - top, rx : 3, fill : 'none', stroke : '#5d8384', 'stroke-dasharray' : '4 3'}, svg);
  const end = Math.min(dies, 1);
  if (end > built) {
    let d = `M${X(built)} ${base}`;
    for (let k = 0; k <= 60; k++) { const m = built + (end - built) * k / 60; d += ` L${X(m).toFixed(1)} ${Y(working(m)).toFixed(1)}`; }
    d += ` L${X(end)} ${base} Z`;
    el('path', {d, fill : '#79d2be', opacity : .38, stroke : '#79d2be', 'stroke-width' : 1.6}, svg);
  }
  const mark = k => TRIGGERS[k][1];
  // Build: a triangle on the floor where the cell gets built.
  const bg = el('path', {d : `M${X(built)} ${base + 2} l-7 10 h14 z`, style : t.build ? `stroke:${mark(t.build)}` : ''}, svg);
  drag(svg, bg, p => { life.build = clamp((p.x - L) / (R - L), 0, Math.min(.95, life.death - .05)); drawLife(); });
  // Work: its level before and after it switches, and where it switches.
  if (end > built) {
    const g1 = el('circle', {cx : X(Math.max(built, .02)) + 6, cy : Y(working(built)), r : 5.5, style : t.work ? `stroke:${mark(t.work)}` : ''}, svg);
    drag(svg, g1, p => { life.from = clamp((base - p.y) / (base - top), 0, 1); drawLife(); });
    const g2 = el('circle', {cx : X(end) - 6, cy : Y(working(end)), r : 5.5, style : t.work ? `stroke:${mark(t.work)}` : ''}, svg);
    drag(svg, g2, p => { life.to = clamp((base - p.y) / (base - top), 0, 1); drawLife(); });
    if (Math.abs(life.to - life.from) > .04 && life.at > built && life.at < end) {
      const g3 = el('rect', {x : X(life.at) - 4, y : Y(working(life.at)) - 4, width : 8, height : 8, transform : `rotate(45 ${X(life.at)} ${Y(working(life.at))})`, style : t.work ? `stroke:${mark(t.work)}` : ''}, svg);
      drag(svg, g3, p => { life.at = clamp((p.x - L) / (R - L), built + .02, end - .02); drawLife(); });
    }
  }
  txt(svg, L + 2, top - 4, 'voll'); txt(svg, R - 2, base + 12, 'aus', {'text-anchor' : 'end'});
  // Death: a cross where it dies; pulled past the end it never dies.
  const dx = dies <= 1 ? X(dies) : R - 8, dy = top - 12;
  if (dies <= 1) el('path', {d : `M${dx} ${dy + 8} V${base}`, stroke : '#e8a2b5', 'stroke-dasharray' : '3 3'}, svg);
  else txt(svg, dx - 12, dy + 4, 'nie', {'text-anchor' : 'end'});
  const dg = el('circle', {cx : dx, cy : dy, r : 8, style : t.death ? `stroke:${mark(t.death)}` : ''}, svg);
  el('path', {d : `M${dx - 4} ${dy - 4} l8 8 m0 -8 l-8 8`, stroke : '#e8a2b5', 'stroke-width' : 2, 'pointer-events' : 'none'}, svg);
  drag(svg, dg, p => { const m = (p.x - L) / (R - L); life.death = m > 1.01 ? 1.1 : clamp(m, life.build + .05, 1); drawLife(); });
  // What sets off each part: maturity or a messenger.
  [['Bau', 'build'], ['Arbeit', 'work'], ['Tod', 'death']].forEach(([name, key], i) => {
    const x = 4 + i * 98, chip = el('g', {class : 'chip'}, svg);
    el('rect', {x, y : 160, width : 94, height : 24, rx : 12}, chip);
    el('circle', {cx : x + 13, cy : 172, r : 5, fill : TRIGGERS[t[key]][1]}, chip);
    txt(chip, x + 23, 176, name + ': ' + TRIGGERS[t[key]][0].replace('Stoff ', ''), {class : 'value'});
    chip.addEventListener('click', () => { t[key] = (t[key] + 1) % TRIGGERS.length; drawLife(); });
  });
  // A part set off by a messenger happens at a level of that messenger, not at an age: a gauge
  // from little to much, with the level where it happens.
  let row = 196;
  for (const [name, key] of [['Bau', 'build'], ['Arbeit', 'work'], ['Tod', 'death']]) {
    if (!t[key]) continue;
    const [stuff, colour] = TRIGGERS[t[key]], id = 'g' + key;
    const grad = el('linearGradient', {id}, el('defs', {}, svg));
    el('stop', {offset : 0, 'stop-color' : colour, 'stop-opacity' : .08}, grad);
    el('stop', {offset : 1, 'stop-color' : colour, 'stop-opacity' : .9}, grad);
    txt(svg, 4, row + 9, name);
    el('rect', {x : 60, y : row, width : 200, height : 10, rx : 5, fill : `url(#${id})`}, svg);
    txt(svg, 296, row + 9, stuff.replace('Stoff ', ''), {'text-anchor' : 'end', class : 'value'});
    life.levels ??= {};
    const at = life.levels[key] ?? .5, g = el('circle', {cx : 60 + 200 * at, cy : row + 5, r : 6.5}, svg);
    drag(svg, g, p => { life.levels[key] = clamp((p.x - 60) / 200, 0, 1); drawLife(); });
    row += 22;
  }
  svg.setAttribute('viewBox', `0 0 300 ${row + 4}`);
}

// ---------- Darm ----------
// A meal as it passes: bites enter at the stomach and travel the gut; the quickly digested part
// fades within some 15 steps, fibre over some 500; what reaches the end is lost. The gut makes
// room for the next bite as fast as its content moves on, so a pushing muscle lets more bites in
// but takes less out of each. Length lengthens the way, and costs rest and room for eggs.
const gut = {length : .45, muscle : .2, food : 0};
const D = {time : 200, quick : 1 / 15, fibre : 1 / 500, shortest : .5, longest : 4, fastest : 8};
const FOODS = [['Flocken', .8, '#f0e2b0'], ['Pflanzen', .2, '#9fd27e']];
const gutSize = L => D.shortest * Math.pow(D.longest / D.shortest, L);
const pushPace = m => 1 + (D.fastest - 1) * m * m;
const uptake = (L, quick, speed = 1) => {
  const passage = speed / (D.time * gutSize(L));
  return quick * D.quick / (D.quick + passage) + (1 - quick) * D.fibre / (D.fibre + passage);
};
// Energy per time with food all around: bites per time follow the pace; each yields its uptake.
const yieldRate = (L, quick, m) => pushPace(m) * uptake(L, quick, pushPace(m));
function gutPath(size) {
  const folds = Math.max(1, Math.round(1 + size * 1.7)), left = 74, high = 32, low = 92, pts = [[62, 62]];
  for (let f = 0; f < folds; f++) {
    const x = left + 26 * f, down = f % 2 === 0;
    for (let k = 0; k <= 14; k++) pts.push([x, down ? high + (low - high) * k / 14 : low - (low - high) * k / 14]);
    for (let k = 1; k <= 8; k++) { const a = Math.PI * k / 8; pts.push([x + 13 - 13 * Math.cos(a), (down ? low : high) + (down ? 1 : -1) * 9 * Math.sin(a)]); }
  }
  const lengths = [0];
  for (let i = 1; i < pts.length; i++) lengths.push(lengths[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const at = s => { const d = clamp(s, 0, 1) * lengths.at(-1); let i = 1; while (i < lengths.length - 1 && lengths[i] < d) i++;
    const t = (d - lengths[i - 1]) / (lengths[i] - lengths[i - 1] || 1); return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]; };
  return {pts, at};
}
let bites = [], clock = 0, spawn = 0, layer = null, lastFrame = 0;
function drawGut() {
  const svg = document.getElementById('gut'); svg.replaceChildren();
  const size = gutSize(gut.length), pace = pushPace(gut.muscle), [food, quick, colour] = FOODS[gut.food];
  // What the meal is (a preview, not a setting of the gut).
  FOODS.forEach(([name], i) => {
    const chip = el('g', {class : 'chip'}, svg), x = 4 + i * 84;
    el('rect', {x, y : 0, width : 80, height : 22, rx : 11, style : i === gut.food ? 'stroke:var(--handle)' : ''}, chip);
    el('circle', {cx : x + 12, cy : 11, r : 4.5, fill : FOODS[i][2]}, chip);
    txt(chip, x + 22, 15, name, {class : 'value'});
    chip.addEventListener('click', () => { gut.food = i; bites = []; drawGut(); });
  });
  const G = el('g', {transform : 'translate(0 20)'}, svg);
  el('path', {d : 'M10 30 Q150 8 290 34 Q300 64 290 102 Q150 126 10 98 Q0 64 10 30 Z', fill : '#16363e', stroke : '#3b6a6c'}, G);
  el('ellipse', {cx : 40, cy : 62, rx : 22, ry : 17, fill : '#2f4a40', stroke : '#d9cfae', 'stroke-width' : 1.6}, G);
  const way = gutPath(size), d = 'M' + way.pts.map(([x, y]) => x.toFixed(1) + ' ' + y.toFixed(1)).join(' L');
  el('path', {d, fill : 'none', stroke : '#d9cfae', 'stroke-width' : 9, 'stroke-linecap' : 'round', 'stroke-linejoin' : 'round', opacity : .55}, G);
  // Muscle rings from the stomach on, as far as the muscle reaches.
  const rings = Math.round(gut.muscle * 20);
  for (let r = 0; r < rings; r++) { const [x, y] = way.at((r + .5) / 20); el('circle', {cx : x, cy : y, r : 4.6, fill : 'none', stroke : '#eaa886', style : `animation:squeeze ${(1.6 / Math.sqrt(pace)).toFixed(2)}s ${(-r * .14).toFixed(2)}s infinite`}, G); }
  layer = el('g', {}, G);
  const [mx, my] = way.at(Math.max(.02, gut.muscle));
  const mg = el('circle', {cx : mx, cy : my, r : 6.5, style : 'stroke:var(--motor)'}, G);
  drag(svg, mg, p => { let best = 0, gap = Infinity; for (let k = 0; k <= 100; k++) { const [x, y] = way.at(k / 100), g = Math.hypot(x - p.x, y - 20 - p.y); if (g < gap) { gap = g; best = k / 100; } } gut.muscle = best < .03 ? 0 : best; drawGut(); });
  const [ex, ey] = way.at(1);
  const eg = el('circle', {cx : ex + 7, cy : ey, r : 6.5}, G);
  drag(svg, eg, p => { const folds = clamp((p.x - 74) / 26, 1, 9), wanted = (folds - 1) / 1.7;
    gut.length = clamp(Math.log(Math.max(D.shortest, wanted) / D.shortest) / Math.log(D.longest / D.shortest), 0, 1); drawGut(); });
  gut.way = way; gut.residence = D.time * size / pace;
  // Numbers: per bite, per time with plenty of food, and the price.
  const per = uptake(gut.length, quick, pace);
  const most = Math.max(...Array.from({length : 21}, (_, i) => Math.max(...Array.from({length : 21}, (_, j) => yieldRate(i / 20, quick, j / 20)))));
  bar(svg, 104, 158, 152, per, '#79d2be', pct(per), 'Je Bissen');
  bar(svg, 104, 178, 152, yieldRate(gut.length, quick, gut.muscle) / most, '#79d2be', pct(yieldRate(gut.length, quick, gut.muscle) / most), 'Viel Futter');
  txt(svg, 4, 220, 'Preis', {class : 'head'});
  const upkeep = .1 * size, room = 1 - .6 * (size - D.shortest) / (D.longest - D.shortest);
  bar(svg, 104, 230, 152, upkeep / .4, '#e8a2b5', '+' + Math.round(upkeep * 100) + ' %', 'Ruhebedarf');
  bar(svg, 104, 250, 152, room, '#d4b7ee', pct(room), 'Platz für Eier');
}
// The film: one step of the gut every 12 ms; a new bite whenever the gut has made room for one.
function gutFrame(now) {
  requestAnimationFrame(gutFrame);
  if (!layer || now - lastFrame < 12) return;
  const steps = Math.min(8, Math.round((now - lastFrame) / 12)); lastFrame = now;
  const [, quick, colour] = FOODS[gut.food], R = gut.residence, room = R / 7;
  for (let s = 0; s < steps; s++) {
    clock++; if (clock - spawn >= room) { spawn = clock; bites.push({born : clock}); }
  }
  bites = bites.filter(b => clock - b.born < R + 40);
  layer.replaceChildren();
  for (const b of bites) {
    const t = clock - b.born, left = quick * Math.exp(-t * D.quick) + (1 - quick) * Math.exp(-t * D.fibre);
    if (t <= R) { const [x, y] = gut.way.at(t / R); el('circle', {cx : x, cy : y, r : 1.5 + 4 * Math.sqrt(left), fill : colour, opacity : .95}, layer); }
    else { const [x, y] = gut.way.at(1); el('circle', {cx : x + 8 + (t - R) * .5, cy : y + (t - R) * .6, r : 1.5 + 4 * Math.sqrt(left), fill : '#8a7f6a', opacity : clamp(1 - (t - R) / 40, 0, 1)}, layer); }
  }
}
requestAnimationFrame(gutFrame);

// ---------- Schwanz ----------
// muscle_fibre: a cell pulls 0.4·6.25^fast, a stroke lasts 4·12^(1−fast) steps, fast fibres tire
// (0.028·fast² per step of work, refilled by 1/400 of the gap) and cost 1.2·0.25^fast at rest.
// environment.hh / movement.cc: wriggling loses up to half the thrust in open water, while the
// drag of a buried body falls from 12 to 3.
const tail = {cells : 6, fast : .5, wriggle : .35};
const force = f => .4 * Math.pow(2.5 / .4, f), stroke = f => 4 * Math.pow(12, 1 - f);
function endurance(f, steps = 300) {
  let r = 1; const out = [];
  for (let s = 0; s < steps; s++) { const a = 1 - f + f * r; out.push(force(f) * a); r = clamp(r - .028 * f * f * a + (1 - r) / 400, 0, 1); }
  return out;
}
function drawTail() {
  const svg = document.getElementById('tail'); svg.replaceChildren();
  const wave = x => Math.sin((x - 20) / 220 * Math.PI * 2.2) * 16 * tail.wriggle * ((x - 20) / 220);
  let up = '', down = '';
  for (let x = 20; x <= 230; x += 5) {
    const half = 26 - (x - 20) * .085;
    up += (x === 20 ? 'M' : ' L') + x + ' ' + (52 - half + wave(x)).toFixed(1);
    down = ` L${x} ${(52 + half + wave(x)).toFixed(1)}` + down;
  }
  const tip = 52 + wave(230);
  el('path', {d : up + ` L272 ${tip - 28} L258 ${tip} L272 ${tip + 28}` + down + ' Z', fill : '#1d4048', stroke : '#8ac7bb', 'stroke-width' : 1.4}, svg);
  for (let k = 0; k < tail.cells; k++) {
    const x = 34 + k * 15;
    for (const s of [-1, 1]) el('circle', {cx : x, cy : 52 + s * 12 + wave(x), r : 3.4, fill : '#eaa886'}, svg);
  }
  const cx = 34 + tail.cells * 15;
  const cg = el('circle', {cx, cy : 52 + wave(cx), r : 6.5, style : 'stroke:var(--motor)'}, svg);
  drag(svg, cg, p => { tail.cells = clamp(Math.round((p.x - 34) / 15), 1, 12); drawTail(); });
  txt(svg, 34, 100, tail.cells + ' Zellen je Seite');
  const wg = el('circle', {cx : 252, cy : tip + 0, r : 6.5}, svg);
  drag(svg, wg, p => { tail.wriggle = clamp(Math.abs(p.y - 52) / 34, 0, 1); drawTail(); });
  txt(svg, 290, 100, 'Schlängeln', {'text-anchor' : 'end'});
  // One stroke of one cell at full drive: force over its duration.
  txt(svg, 4, 132, 'Ein Schlag', {class : 'head'});
  const X0 = 6, W = 288, B = 206, H = 60, steps = 48, maxF = force(1);
  el('path', {d : `M${X0} ${B} H${X0 + W}`, stroke : '#3b6a6c'}, svg);
  const len = stroke(tail.fast), peak = force(tail.fast), path = [];
  for (let k = 0; k <= 40; k++) { const t = k / 40, s = Math.sin(Math.PI * t); path.push(`${(X0 + W * t * len / steps).toFixed(1)} ${(B - H * peak * s * s / maxF).toFixed(1)}`); }
  el('path', {d : 'M' + path.join(' L') + ' Z', fill : '#eaa886', opacity : .6, stroke : '#eaa886', 'stroke-width' : 1.5}, svg);
  txt(svg, X0, B + 14, '0'); txt(svg, X0 + W, B + 14, steps + ' Schritte', {'text-anchor' : 'end'});
  const px = X0 + W * len / steps / 2, py = B - H * peak / maxF;
  const fg = el('circle', {cx : px, cy : py, r : 6.5}, svg);
  drag(svg, fg, p => { const l = clamp(2 * (p.x - X0) / W * steps, 4, 48); tail.fast = clamp(1 - Math.log(l / 4) / Math.log(12), 0, 1); drawTail(); });
  txt(svg, px + 12, py + 4, tail.fast > .66 ? 'schnelle Fasern' : tail.fast < .33 ? 'langsame Fasern' : 'gemischt');
  // Flat out for 300 steps: what is left of the force.
  txt(svg, 4, 244, 'Vollgas über Zeit', {class : 'head'});
  const E = endurance(tail.fast), eB = 296, eH = 40;
  el('path', {d : `M${X0} ${eB} H${X0 + W}`, stroke : '#3b6a6c'}, svg);
  el('path', {d : 'M' + E.map((v, s) => `${(X0 + W * s / (E.length - 1)).toFixed(1)} ${(eB - eH * v / maxF).toFixed(1)}`).join(' L') + ` L${X0 + W} ${eB} L${X0} ${eB} Z`, fill : '#eaa886', opacity : .35, stroke : '#eaa886', 'stroke-width' : 1.6}, svg);
  txt(svg, X0, eB + 14, '0'); txt(svg, X0 + W, eB + 14, '300 Schritte', {'text-anchor' : 'end'});
  // Wriggling: speed in open water against speed buried.
  const water = 1 - .5 * tail.wriggle, sand = 3 / (12 * Math.pow(3 / 12, tail.wriggle));
  bar(svg, 76, 322, 180, water, '#8ac7bb', pct(water), 'Im Wasser');
  bar(svg, 76, 340, 180, sand, '#c9b48c', pct(sand), 'Im Sand');
}
drawLife(); drawGut(); drawTail();
</script>
