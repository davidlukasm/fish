<title>Muster-Inspektoren Atelier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: three inspector panels at their real 320 px width, side by side, as in the atelier. */
:root{color-scheme:dark;--ground:#09212a;--panel:#143039;--edge:#2d5059;--text:#d7e6e3;--soft:#9fbcbc;--axis:#a7c2be;
  --handle:#f1dda6;--handle-core:#153a40;--teal:#79d2be;--motor:#eaa886;--gut:#d9cfae;--cost:#e8a2b5;
  --eggs:#d4b7ee;--fish:#8ac7bb;--track:#0f2c34}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:14px/1.45 system-ui,sans-serif}
main{display:flex;flex-wrap:wrap;gap:24px;padding-block:20px;align-items:flex-start}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{width:320px;max-width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px 10px 14px}
.panel h2{margin:0 0 2px 2px;font:500 12px/1.3 system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.panel h3{margin:0 0 6px 2px;font:400 21px/1.2 Georgia,serif;color:#eef4ec}
svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;overflow:visible}
svg text{fill:var(--axis);font-size:11px}
svg text.head{fill:var(--text);font-size:12px;font-weight:500}
svg text.value{fill:var(--text);font-variant-numeric:tabular-nums}
.grip{fill:var(--handle-core);stroke:var(--handle);stroke-width:2.2;cursor:grab}
.grip:hover,.grip.dragging{stroke:#fff3c4;stroke-width:3}
.grip.dragging{cursor:grabbing}
.chip{cursor:pointer}
.triggers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 4px}
.triggers label{min-width:0;display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--axis)}
.triggers select{width:100%;font:12px system-ui;color:var(--text);background:#0f2c34;border:1px solid var(--edge);border-radius:6px;padding:4px 4px;min-width:0}
.triggers select:focus-visible{outline:2px solid var(--handle);outline-offset:1px}
.panel h4{margin:14px 0 2px 2px;font:500 12px/1.3 system-ui;color:var(--text)}
.chip rect{fill:var(--track);stroke:var(--edge)}
.chip:hover rect{stroke:var(--handle)}
.note{color:var(--soft);font-size:12px;max-width:1010px;padding-block:0 24px;margin:0}
.note b{color:var(--text);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes squeeze{0%,100%{r:4.6;stroke-width:1.4}40%{r:2.6;stroke-width:3.2}}
</style>
<main>
  <section class="panel" aria-label="Lebenszyklus der Zelle">
    <h2>Zelle</h2><h3>Lebenszyklus der Zelle</h3>
    <svg id="life" viewBox="0 0 300 200"></svg>
    <div class="triggers" id="triggers"></div>
    <div id="stuffs"></div>
  </section>
  <section class="panel" aria-label="Darm">
    <h2>Organ</h2><h3>Darm</h3>
    <svg id="gut" viewBox="0 0 300 266"></svg>
  </section>
  <section class="panel" aria-label="Schwanz">
    <h2>Organ</h2><h3>Schwanz</h3>
    <svg id="tail" viewBox="0 0 300 300"></svg>
  </section>
</main>
<p class="note"><b>Entwurf zum Anklicken.</b> Gezogen wird an den gelben Griffen. Der Darm ist noch der alte Stand: Er wird neu gebaut, sobald Fables neues Verdauungsmodell steht.</p>
<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const txt = (parent, x, y, s, attrs = {}) => { const t = el('text', {x, y, ...attrs}, parent); t.textContent = s; return t; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pct = x => Math.round(x * 100) + ' %';
// Dragging: the pointer is captured by the drawing itself, which stays while its contents are
// redrawn on every move; the held grip is marked again after each redraw by its name.
let held = null;
function drag(svg, grip, move, name = 'grip' + svg.querySelectorAll('.grip').length) {
  grip.classList.add('grip');
  grip.setAttribute('data-name', name);
  if (held?.svg === svg && held.name === name) grip.classList.add('dragging');
  grip.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    svg.setPointerCapture(e.pointerId);
    held = {svg, name};
    grip.classList.add('dragging');
    const at = ev => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
    const onMove = ev => move(at(ev));
    const up = () => { held = null; svg.removeEventListener('pointermove', onMove); svg.removeEventListener('pointerup', up); svg.removeEventListener('pointercancel', up); svg.querySelectorAll('.dragging').forEach(g => g.classList.remove('dragging')); };
    svg.addEventListener('pointermove', onMove); svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  });
}
// A bar of a share, with its value at the right.
function bar(svg, x, y, w, share, colour, value, name) {
  if (name) txt(svg, 4, y + 10, name);
  el('rect', {x, y, width : w, height : 12, rx : 3, fill : '#0f2c34', stroke : '#2d5059'}, svg);
  el('rect', {x, y, width : w * clamp(share, 0, 1), height : 12, rx : 3, fill : colour, opacity : .75}, svg);
  txt(svg, 296, y + 10, value, {'text-anchor' : 'end', class : 'value'});
}

// ---------- Lebenszyklus ----------
// Three actions: the cell comes into being, it works, it dies. Each is one answer that switches
// once, from a level before to a level after, at a point and with a steepness in four steps
// (hormones.hh: x = (c / half)^(2^steepness), answer = before + (after − before)·x / (1 + x)); c is
// the fish's maturity or one messenger's level. "automatisch": the cell is there from the egg on,
// works fully, and never dies before the fish does.
const STUFF = [['A', '#e8a2b5'], ['B', '#d4b7ee'], ['C', '#9cc8f0'], ['D', '#8fdcc0'], ['E', '#f0c58a'], ['F', '#c9e58f']];
const ACTIONS = [['become', 'Entstehen'], ['work', 'Aktivität'], ['die', 'Tod']];
const life = {
  hatch : .3,
  become : {by : 'maturity', at : .12},
  work : {by : 'maturity', at : .7, from : 1, to : .3, steep : 2},
  die : {by : 'auto', at : .9}
};
const bound = (c, half, steep) => { const x = Math.pow(Math.max(0, c) / half, Math.pow(2, steep)); return x / (1 + x); };
const levelAt = (w, c) => w.from + (w.to - w.from) * bound(c, Math.max(.02, w.at), w.steep);
// The choices: one per action, a messenger picked in the same list.
function drawTriggers() {
  const box = document.getElementById('triggers'); box.replaceChildren();
  for (const [key, name] of ACTIONS) {
    const label = document.createElement('label'), select = document.createElement('select');
    label.textContent = name; select.id = 'trigger-' + key;
    for (const [value, word] of [['auto', 'automatisch'], ['maturity', 'Reife'], ...STUFF.map(([n], i) => ['stuff' + i, 'Botenstoff ' + n])]) {
      const o = document.createElement('option'); o.value = value; o.textContent = word; select.appendChild(o);
    }
    select.value = life[key].by;
    select.addEventListener('change', () => { life[key].by = select.value; drawLife(); });
    label.appendChild(select); box.appendChild(label);
  }
}
function drawLife() {
  drawTriggers();
  diagram(document.getElementById('life'), 'maturity');
  // A picture of its own for each messenger in use, with the actions it sets off.
  const box = document.getElementById('stuffs'); box.replaceChildren();
  const used = [...new Set(ACTIONS.map(([k]) => life[k].by).filter(b => b.startsWith('stuff')))];
  for (const by of used) {
    const [n] = STUFF[Number(by.slice(5))];
    const h = document.createElement('h4');
    h.textContent = ACTIONS.filter(([k]) => life[k].by === by).map(([, name]) => name).join(', ') + ' abhängig von ' + n;
    const svg = document.createElementNS(NS, 'svg'); svg.id = 'life-' + by;
    box.append(h, svg);
    diagram(svg, by);
  }
}
function diagram(svg, by) {
  svg.replaceChildren();
  const stuff = by.startsWith('stuff') ? STUFF[Number(by.slice(5))] : null;
  const plain = !!stuff && life.work.by !== by;
  const L = 14, R = 286, X = c => L + (R - L) * clamp(c, 0, 1), top = plain ? 64 : 66, base = plain ? 72 : 178;
  const Y = v => base - (base - top) * v, fit = p => clamp((p.x - L) / (R - L), 0, 1);
  const b = life.become, w = life.work, d = life.die, here = a => a.by === by;
  if (!stuff) {
    // The fish's life is the axis: egg, hatching, young fish, adult.
    el('rect', {x : L, y : 0, width : X(life.hatch) - L, height : 40, rx : 6, fill : '#1a3c44'}, svg);
    for (const [c, kind] of [[life.hatch * .5, 'egg'], [life.hatch, 'hatch'], [.6, 'young'], [.95, 'adult']]) {
      const x = X(c), cy = 16;
      if (kind === 'egg') el('ellipse', {cx : x, cy, rx : 7, ry : 9, fill : 'none', stroke : '#e9e2c6', 'stroke-width' : 1.5}, svg);
      else if (kind === 'hatch') {
        el('path', {d : `M${x - 7} ${cy + 2} a7 8 0 0 0 14 0 l-3 -3 -3 3 -3 -3 -3 3 z`, fill : 'none', stroke : '#e9e2c6', 'stroke-width' : 1.4}, svg);
        el('path', {d : `M${x - 4} ${cy - 5} q4 -6 8 0 q-4 5 -8 0 z`, fill : 'none', stroke : '#e9e2c6', 'stroke-width' : 1.2}, svg);
      } else {
        const sz = kind === 'young' ? .7 : 1.15, ww = 14 * sz, h = 6 * sz;
        el('path', {d : `M${x - ww} ${cy} Q${x} ${cy - h * 1.6} ${x + ww} ${cy} Q${x} ${cy + h * 1.6} ${x - ww} ${cy} Z M${x + ww} ${cy} l${5 * sz} ${-4 * sz} v${8 * sz} Z`, fill : 'none', stroke : '#e9e2c6', 'stroke-width' : 1.3}, svg);
      }
    }
    txt(svg, L + 4, 35, 'Ei'); txt(svg, X(life.hatch) + 4, 35, 'Schlupf');
    txt(svg, X(.6), 35, 'Jungfisch', {'text-anchor' : 'middle'}); txt(svg, R, 35, 'erwachsen', {'text-anchor' : 'end'});
  } else {
    // The messenger's level is the axis: little to much.
    const id = 'lv' + by, grad = el('linearGradient', {id}, el('defs', {}, svg));
    el('stop', {offset : 0, 'stop-color' : stuff[1], 'stop-opacity' : .06}, grad);
    el('stop', {offset : 1, 'stop-color' : stuff[1], 'stop-opacity' : .85}, grad);
    el('rect', {x : L, y : 6, width : R - L, height : 22, rx : 11, fill : `url(#${id})`}, svg);
    txt(svg, L + 6, 21, 'wenig ' + stuff[0]); txt(svg, R - 6, 21, 'viel ' + stuff[0], {'text-anchor' : 'end', style : 'fill:#0d262c'});
  }
  // On the life axis the cell exists from its coming into being to its death; set elsewhere, from
  // the egg on and to the end.
  const from = here(b) ? b.at : 0, to = here(d) ? d.at : 1;
  const working = !stuff || here(w);
  const level = c => here(w) ? levelAt(w, c) : w.by === 'auto' || stuff ? 1 : .5;
  el('path', {d : `M${L} ${base} H${R}`, stroke : '#3b6a6c'}, svg);
  if (working) {
    el('path', {d : `M${L} ${top} H${R}`, stroke : '#3b6a6c', 'stroke-dasharray' : '2 4'}, svg);
    txt(svg, L, top - 5, 'volle Aktivität'); txt(svg, L, base + 14, 'keine Aktivität');
  }
  if (working && from > 0)
    el('rect', {x : L, y : top, width : X(from) - L, height : base - top, rx : 3, fill : 'none', stroke : '#5d8384', 'stroke-dasharray' : '4 3'}, svg);
  if (working && to > from) {
    const elsewhere = !stuff && w.by.startsWith('stuff');
    let path = `M${X(from)} ${base}`;
    for (let k = 0; k <= 90; k++) { const c = from + (to - from) * k / 90; path += ` L${X(c).toFixed(1)} ${Y(level(c)).toFixed(1)}`; }
    el('path', {d : path + ` L${X(to)} ${base} Z`, fill : elsewhere ? STUFF[Number(w.by.slice(5))][1] : '#79d2be', opacity : elsewhere ? .16 : .4, stroke : '#79d2be', 'stroke-width' : 1.6, 'stroke-dasharray' : elsewhere ? '4 4' : 'none'}, svg);
    if (elsewhere) txt(svg, (X(from) + X(to)) / 2, (top + base) / 2 + 4, 'Aktivität abhängig von ' + STUFF[Number(w.by.slice(5))][0], {'text-anchor' : 'middle', class : 'value'});
  }
  if (here(b)) {
    el('path', {d : `M${X(b.at)} ${top - 10} V${base}`, stroke : '#e9e2c6', 'stroke-dasharray' : '3 3'}, svg);
    const g = el('path', {d : `M${X(b.at)} ${base + 2} l-8 12 h16 z`}, svg);
    drag(svg, g, p => { b.at = Math.min(fit(p), here(d) ? d.at - .04 : 1); drawLife(); }, 'become');
    txt(svg, X(b.at) + (X(b.at) < 120 ? 10 : -10), base + 28, 'entsteht', {'text-anchor' : X(b.at) < 120 ? 'start' : 'end'});
  }
  if (here(w) && to > from) {
    const g1 = el('circle', {cx : X(from) + 8, cy : Y(level(from)), r : 6.5}, svg);
    drag(svg, g1, p => { w.from = clamp((base - p.y) / (base - top), 0, 1); drawLife(); }, 'before');
    const g2 = el('circle', {cx : X(to) - 8, cy : Y(level(to)), r : 6.5}, svg);
    drag(svg, g2, p => { w.to = clamp((base - p.y) / (base - top), 0, 1); drawLife(); }, 'after');
    if (Math.abs(w.to - w.from) > .04) {
      // The switch: where along, and how steep (pulled up: abrupt, down: soft).
      const at = clamp(w.at, from + .02, to - .02), cx = X(at), cy = Y(levelAt(w, at));
      const g3 = el('rect', {x : cx - 6, y : cy - 6, width : 12, height : 12, transform : `rotate(45 ${cx} ${cy})`}, svg);
      const start = {y : cy, steep : w.steep};
      drag(svg, g3, p => { w.at = clamp(fit(p), from + .02, to - .02); w.steep = clamp(Math.round(start.steep + (start.y - p.y) / 18), 0, 3); drawLife(); }, 'switch');
    }
  }
  if (here(d)) {
    const cx = X(d.at), cy = top - 22;
    el('path', {d : `M${cx} ${cy + 8} V${base}`, stroke : '#e8a2b5', 'stroke-dasharray' : '3 3'}, svg);
    const g = el('circle', {cx, cy, r : 8.5}, svg);
    el('path', {d : `M${cx - 4} ${cy - 4} l8 8 m0 -8 l-8 8`, stroke : '#e8a2b5', 'stroke-width' : 2, 'pointer-events' : 'none'}, svg);
    drag(svg, g, p => { d.at = Math.max(fit(p), here(b) ? b.at + .04 : .02); drawLife(); }, 'die');
    txt(svg, cx - 12, cy + 4, 'stirbt', {'text-anchor' : 'end'});
  }
  svg.setAttribute('viewBox', `0 0 300 ${base + 34}`);
}

// ---------- Darm ----------
// A meal as it passes: bites enter at the stomach and travel the gut; the quickly digested part
// fades within some 15 steps, fibre over some 500; what reaches the end is lost. The gut makes
// room for the next bite as fast as its content moves on, so a pushing muscle lets more bites in
// but takes less out of each. Length lengthens the way, and costs rest and room for eggs.
const gut = {length : .45, muscle : .2, food : 0};
const D = {time : 200, quick : 1 / 15, fibre : 1 / 500, shortest : .5, longest : 4, fastest : 8};
const FOODS = [['Flocken', .8, '#f0e2b0'], ['Pflanzen', .2, '#9fd27e']];
const gutSize = L => D.shortest * Math.pow(D.longest / D.shortest, L);
const pushPace = m => 1 + (D.fastest - 1) * m * m;
const uptake = (L, quick, speed = 1) => {
  const passage = speed / (D.time * gutSize(L));
  return quick * D.quick / (D.quick + passage) + (1 - quick) * D.fibre / (D.fibre + passage);
};
// Energy per time with food all around: bites per time follow the pace; each yields its uptake.
const yieldRate = (L, quick, m) => pushPace(m) * uptake(L, quick, pushPace(m));
function gutPath(size) {
  const folds = Math.max(1, Math.round(1 + size * 1.7)), left = 74, high = 32, low = 92, pts = [[62, 62]];
  for (let f = 0; f < folds; f++) {
    const x = left + 26 * f, down = f % 2 === 0;
    for (let k = 0; k <= 14; k++) pts.push([x, down ? high + (low - high) * k / 14 : low - (low - high) * k / 14]);
    for (let k = 1; k <= 8; k++) { const a = Math.PI * k / 8; pts.push([x + 13 - 13 * Math.cos(a), (down ? low : high) + (down ? 1 : -1) * 9 * Math.sin(a)]); }
  }
  const lengths = [0];
  for (let i = 1; i < pts.length; i++) lengths.push(lengths[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const at = s => { const d = clamp(s, 0, 1) * lengths.at(-1); let i = 1; while (i < lengths.length - 1 && lengths[i] < d) i++;
    const t = (d - lengths[i - 1]) / (lengths[i] - lengths[i - 1] || 1); return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]; };
  return {pts, at};
}
let bites = [], clock = 0, spawn = 0, layer = null, lastFrame = 0;
function drawGut() {
  const svg = document.getElementById('gut'); svg.replaceChildren();
  const size = gutSize(gut.length), pace = pushPace(gut.muscle), [food, quick, colour] = FOODS[gut.food];
  // What the meal is (a preview, not a setting of the gut).
  FOODS.forEach(([name], i) => {
    const chip = el('g', {class : 'chip'}, svg), x = 4 + i * 84;
    el('rect', {x, y : 0, width : 80, height : 22, rx : 11, style : i === gut.food ? 'stroke:var(--handle)' : ''}, chip);
    el('circle', {cx : x + 12, cy : 11, r : 4.5, fill : FOODS[i][2]}, chip);
    txt(chip, x + 22, 15, name, {class : 'value'});
    chip.addEventListener('click', () => { gut.food = i; bites = []; drawGut(); });
  });
  const G = el('g', {transform : 'translate(0 20)'}, svg);
  el('path', {d : 'M10 30 Q150 8 290 34 Q300 64 290 102 Q150 126 10 98 Q0 64 10 30 Z', fill : '#16363e', stroke : '#3b6a6c'}, G);
  el('ellipse', {cx : 40, cy : 62, rx : 22, ry : 17, fill : '#2f4a40', stroke : '#d9cfae', 'stroke-width' : 1.6}, G);
  const way = gutPath(size), d = 'M' + way.pts.map(([x, y]) => x.toFixed(1) + ' ' + y.toFixed(1)).join(' L');
  el('path', {d, fill : 'none', stroke : '#d9cfae', 'stroke-width' : 9, 'stroke-linecap' : 'round', 'stroke-linejoin' : 'round', opacity : .55}, G);
  // Muscle rings from the stomach on, as far as the muscle reaches.
  const rings = Math.round(gut.muscle * 20);
  for (let r = 0; r < rings; r++) { const [x, y] = way.at((r + .5) / 20); el('circle', {cx : x, cy : y, r : 4.6, fill : 'none', stroke : '#eaa886', style : `animation:squeeze ${(1.6 / Math.sqrt(pace)).toFixed(2)}s ${(-r * .14).toFixed(2)}s infinite`}, G); }
  layer = el('g', {}, G);
  const [mx, my] = way.at(Math.max(.02, gut.muscle));
  const mg = el('circle', {cx : mx, cy : my, r : 6.5, style : 'stroke:var(--motor)'}, G);
  drag(svg, mg, p => { let best = 0, gap = Infinity; for (let k = 0; k <= 100; k++) { const [x, y] = way.at(k / 100), g = Math.hypot(x - p.x, y - 20 - p.y); if (g < gap) { gap = g; best = k / 100; } } gut.muscle = best < .03 ? 0 : best; drawGut(); });
  const [ex, ey] = way.at(1);
  const eg = el('circle', {cx : ex + 7, cy : ey, r : 6.5}, G);
  drag(svg, eg, p => { const folds = clamp((p.x - 74) / 26, 1, 9), wanted = (folds - 1) / 1.7;
    gut.length = clamp(Math.log(Math.max(D.shortest, wanted) / D.shortest) / Math.log(D.longest / D.shortest), 0, 1); drawGut(); });
  gut.way = way; gut.residence = D.time * size / pace;
  // Numbers: per bite, per time with plenty of food, and the price.
  const per = uptake(gut.length, quick, pace);
  const most = Math.max(...Array.from({length : 21}, (_, i) => Math.max(...Array.from({length : 21}, (_, j) => yieldRate(i / 20, quick, j / 20)))));
  bar(svg, 104, 158, 152, per, '#79d2be', pct(per), 'Je Bissen');
  bar(svg, 104, 178, 152, yieldRate(gut.length, quick, gut.muscle) / most, '#79d2be', pct(yieldRate(gut.length, quick, gut.muscle) / most), 'Viel Futter');
  txt(svg, 4, 220, 'Preis', {class : 'head'});
  const upkeep = .1 * size, room = 1 - .6 * (size - D.shortest) / (D.longest - D.shortest);
  bar(svg, 104, 230, 152, upkeep / .4, '#e8a2b5', '+' + Math.round(upkeep * 100) + ' %', 'Ruhebedarf');
  bar(svg, 104, 250, 152, room, '#d4b7ee', pct(room), 'Platz für Eier');
}
// The film: one step of the gut every 12 ms; a new bite whenever the gut has made room for one.
function gutFrame(now) {
  requestAnimationFrame(gutFrame);
  if (!layer || now - lastFrame < 12) return;
  const steps = Math.min(8, Math.round((now - lastFrame) / 12)); lastFrame = now;
  const [, quick, colour] = FOODS[gut.food], R = gut.residence, room = R / 7;
  for (let s = 0; s < steps; s++) {
    clock++; if (clock - spawn >= room) { spawn = clock; bites.push({born : clock}); }
  }
  bites = bites.filter(b => clock - b.born < R + 40);
  layer.replaceChildren();
  for (const b of bites) {
    const t = clock - b.born, left = quick * Math.exp(-t * D.quick) + (1 - quick) * Math.exp(-t * D.fibre);
    if (t <= R) { const [x, y] = gut.way.at(t / R); el('circle', {cx : x, cy : y, r : 1.5 + 4 * Math.sqrt(left), fill : colour, opacity : .95}, layer); }
    else { const [x, y] = gut.way.at(1); el('circle', {cx : x + 8 + (t - R) * .5, cy : y + (t - R) * .6, r : 1.5 + 4 * Math.sqrt(left), fill : '#8a7f6a', opacity : clamp(1 - (t - R) / 40, 0, 1)}, layer); }
  }
}
requestAnimationFrame(gutFrame);

// ---------- Schwanz ----------
// How and how strongly the tail beats, set by what it means: how much push the fish has when it
// sets off, and how much is left after it has swum flat out for a while. A cell's fibres run from
// slow to fast (muscle_fibre): fast ones pull 6.25 times as hard in a stroke 12 times as short, but
// tire (0.028·fast² per step of work, refilled by 1/400 of the gap); slow ones never tire. From the
// two pushes the inspector works out the number of cells and the fibre mix. Wriggling (movement.cc,
// environment.hh) loses up to half the push in open water but lowers a buried body's drag from 12
// to 3.
const tail = {cells : 6, fast : .55, wriggle : .3};
const STEPS = 300, MOST_CELLS = 12, MOST_PUSH = 15;
const force = f => .4 * Math.pow(2.5 / .4, f), strokeSteps = f => 4 * Math.pow(12, 1 - f);
function staying(f) {
  let r = 1;
  for (let s = 0; s < STEPS; s++) { const a = 1 - f + f * r; r = clamp(r - .028 * f * f * a + (1 - r) / 400, 0, 1); }
  return 1 - f + f * r;
}
const curve = f => { let r = 1; const out = []; for (let s = 0; s <= STEPS; s++) { const a = 1 - f + f * r; out.push(a); r = clamp(r - .028 * f * f * a + (1 - r) / 400, 0, 1); } return out; };
// The fibre mix for a share of the push that is left after flat out: the share falls as the fibres
// get faster.
function mixFor(share) {
  let best = 0, gap = Infinity;
  for (let k = 0; k <= 200; k++) { const f = k / 200, g = Math.abs(staying(f) - share); if (g < gap) { gap = g; best = f; } }
  return best;
}
let beat = 0, tailSvg = null;
function drawTail() {
  const svg = document.getElementById('tail'); svg.replaceChildren(); tailSvg = svg;
  // The fish, beating its tail: as hard as its push at the start, as quick as its strokes, as
  // wavy as it wriggles (animated in tailFrame).
  el('g', {id : 'tail-fish'}, svg);
  // Grip on the body: pulled away from the middle line, the body wriggles more.
  const wg = el('circle', {cx : 170, cy : 44 + 6 + 30 * tail.wriggle, r : 6.5}, svg);
  drag(svg, wg, p => { tail.wriggle = clamp((p.y - 50) / 30, 0, 1); drawTail(); }, 'wriggle');
  txt(svg, 180, 44 + 10 + 30 * tail.wriggle, tail.wriggle < .2 ? 'steif' : tail.wriggle > .7 ? 'schlängelt stark' : 'schlängelt');
  // Push over time when swimming flat out; in open water, and buried in sand.
  const X0 = 30, W = 256, B = 236, H = 120, X = s => X0 + W * s / STEPS, Y = v => B - H * v / MOST_PUSH;
  const push = tail.cells * force(tail.fast), c = curve(tail.fast);
  const water = 1 - .5 * tail.wriggle, sand = 1 / (12 * Math.pow(3 / 12, tail.wriggle));
  el('path', {d : `M${X0} ${B} H${X0 + W} M${X0} ${B} V${B - H}`, stroke : '#3b6a6c', fill : 'none'}, svg);
  txt(svg, X0 - 4, B - H + 4, 'Schub', {'text-anchor' : 'end', style : 'writing-mode:initial'});
  const line = k => 'M' + c.map((a, s) => `${X(s).toFixed(1)} ${Y(push * a * k).toFixed(1)}`).join(' L');
  el('path', {d : line(water) + ` L${X(STEPS)} ${B} L${X0} ${B} Z`, fill : '#eaa886', opacity : .3, stroke : '#eaa886', 'stroke-width' : 2}, svg);
  el('path', {d : line(sand), fill : 'none', stroke : '#c9b48c', 'stroke-width' : 2, 'stroke-dasharray' : '5 4'}, svg);
  txt(svg, X(STEPS) - 2, Y(push * c[STEPS] * water) - 6, 'im Wasser', {'text-anchor' : 'end', style : 'fill:#eaa886'});
  txt(svg, X(0) + 10, Y(push * sand) - 5, 'im Sand', {style : 'fill:#c9b48c'});
  txt(svg, X0, B + 14, 'Start'); txt(svg, X0 + W, B + 14, STEPS + ' Schritte Vollgas', {'text-anchor' : 'end'});
  // Grips: the push when setting off, and the push still there at the end.
  const g1 = el('circle', {cx : X(0), cy : Y(push * water), r : 7}, svg);
  drag(svg, g1, p => {
    const wanted = clamp((B - p.y) / H, .02, 1) * MOST_PUSH / water;
    tail.cells = clamp(Math.round(wanted / force(tail.fast)), 1, MOST_CELLS); drawTail();
  }, 'start');
  const g2 = el('circle', {cx : X(STEPS), cy : Y(push * c[STEPS] * water), r : 7}, svg);
  drag(svg, g2, p => {
    const left = clamp((B - p.y) / H * MOST_PUSH / water, 0, push);
    tail.fast = mixFor(clamp(left / push, .2, 1)); drawTail();
  }, 'end');
  const kind = tail.fast > .66 ? 'Sprinter' : tail.fast < .33 ? 'Dauerschwimmer' : 'Allrounder';
  txt(svg, X0 + 8, B - H + 4, kind, {class : 'head'});
  // What follows, as information: cells, fibres, beat and upkeep.
  txt(svg, 4, 276, tail.cells + ' Muskelzellen je Seite · ' + Math.round(tail.fast * 100) + ' % schnelle Fasern', {class : 'value'});
  txt(svg, 4, 292, 'ein Schlag dauert ' + Math.round(strokeSteps(tail.fast)) + ' Schritte · Unterhalt ' + (tail.cells * 1.2 * Math.pow(.25, tail.fast)).toFixed(1).replace('.', ','), {class : 'value'});
}
function tailFrame(now) {
  requestAnimationFrame(tailFrame);
  const g = document.getElementById('tail-fish'); if (!g) return;
  const period = strokeSteps(tail.fast) * 2 * 16, phase = (now % period) / period * Math.PI * 2;
  const amp = 3 + 18 * clamp(tail.cells * force(tail.fast) / MOST_PUSH, 0, 1);
  const bend = x => { const t = (x - 40) / 200; return Math.sin(phase - t * (1.5 + 4 * tail.wriggle)) * amp * Math.pow(t, 2 - 1.4 * tail.wriggle); };
  let up = '', down = '';
  for (let x = 40; x <= 220; x += 5) {
    const t = (x - 40) / 180, half = t < .35 ? 6 + 16 * Math.sin(Math.PI / 2 * t / .35) : 4 + 18 * (1 - (t - .35) / .65);
    up += (x === 40 ? 'M' : ' L') + x + ' ' + (44 - half + bend(x)).toFixed(1);
    down = ` L${x} ${(44 + half + bend(x)).toFixed(1)}` + down;
  }
  const tip = 44 + bend(220);
  g.innerHTML = `<path d="${up} L250 ${(tip - 22).toFixed(1)} L240 ${tip.toFixed(1)} L250 ${(tip + 22).toFixed(1)}${down} Z" fill="#1d4048" stroke="#8ac7bb" stroke-width="1.4"/><circle cx="62" cy="${(40 + bend(62)).toFixed(1)}" r="3" fill="#e9e2c6"/>`;
}
requestAnimationFrame(tailFrame);

drawLife(); drawGut(); drawTail();
</script>
