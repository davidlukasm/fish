name: Temporary Studio format check-in
on:
  push:
    branches:
      - codex/v019-studio-hormone-learning
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install clang-format 18
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-18
      - name: Format source
        run: ./format.sh --write
      - name: Commit formatting to work branch
        run: |
          git config user.name "fish-studio-format"
          git config user.email "noreply@github.com"
          git add ui/studio.js ui/studio_panels.js tests/studio.js werkzeug/atelier.cc
          if ! git diff --cached --quiet; then
            git commit -m "Format Studio editor changes"
            git push origin HEAD:codex/v019-studio-hormone-learning
          fi
