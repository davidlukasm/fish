name: Temporary Atelier work-branch formatter
on:
  push:
    branches: [codex/v019-studio-hormone-learning]
concurrency:
  group: atelier-work-branch-format
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install clang-format 18
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-18
      - name: Apply project formatting
        run: ./format.sh --write
      - name: Commit mechanical formatting
        run: |
          git config user.name "fish-studio-format"
          git config user.email "noreply@github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Format Studio work branch"
            git push origin HEAD:codex/v019-studio-hormone-learning
          fi
